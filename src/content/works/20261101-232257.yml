title: 回南天
cp:
  - 泰正
updated: 2026-11-01
status: finished
chapters:
  - body: |-
      田柾國待了一整天的錄音室，終於在錄音師思考過後說出的那句辛苦了後結束。眼皮重的歌詞上的筆記都有些暈開，此刻他只想回家休息。公司的長廊幾近無聲，是專門給公司藝人的樓層，地板的細小絨毛讓儘管穿著馬丁靴的他走路起來也毫無聲響。踱步到工作室門口正要開門，金泰亨從隔壁工作室開門出來。

      ⠀

      田柾國怔愣，他不記得金泰亨有說過今天會在公司，自己難道看錯了嗎？他還特別看過的。這陣子成員各自都在忙碌，自從美國回來後就少有見面的時刻，來往無數國家他們甚至也不怎麼常落足同一片土地，而報備的習慣自出道初期延續至今，滿足了兩人心中難以言明的私慾。

      ⠀

      他下意識喊了聲「泰亨哥？」，那人臉上沒什麼笑卻也看上去不驚訝，似水般平靜同他知道田柾國在他開門後的下一秒就會在他眼前。

      ⠀

      「錄完音了嗎？」「嗯。」田柾國轉頭進了工作室，把散落的個人物品一一收回包包，金泰亨就這樣在門框上倚著看他，心裡叨叨著這傢伙怎麼一天到晚一身黑。以田柾國的「嗯」為結，空間迴盪著細微的電流聲。

      ⠀

      「餓了嗎？」他漫不經心的問。

      「嗯。」「哥吃了嗎？」田柾國闔上工作室的門。金泰亨看著皮鞋的頭和一旁的馬丁鞋幾乎同步甚至踏出順序一致，倘若有腳步聲聽上去也肯定只有一個人般。好像是錯覺，金泰亨總覺得田柾國也有些心虛。

      ⠀

      「等你所以還沒吃。」

      ⠀

      他們各自把自己裹的嚴嚴實實的，但在下樓的過程中被工作人員攔住，愣是硬開車前往了公司100公尺外的一家燒肉店。

      ⠀

      下班時間交通堵得不行，金泰亨覺得心裡也堵得不行。走路的人聲嘈雜足以緩解窘迫，說了什麼後悔還能開脫是聽錯了。而田柾國看著窗外，金泰亨幾次欲言又止，微妙的氣息散開此刻各自心中大概都在泛起漣漪。偶爾田柾國聞見駕駛座的沙沙聲幾次想回頭還是感覺脖子被什麼堵著。

      ⠀

      這是他們真正提了分開後第一次單獨見面，金泰亨卻覺得是幾年前了，漫長的團體活動把時間拉得冗長。他總感覺自己也沒怎麼想過他們，只是他依然把後來深夜在某位成員家中眾人醉酒寢下後，獨自醒來待在客廳的田柾國的背影記得清晰。他後來在田柾國房間桌上發現了剩下一顆、用鋁箔包裝的安眠藥。整個客廳只有電腦方方正正的白光，金泰亨不記得他是在剪影片還是做音樂了，記起那道光只是因為就著光線能描繪出田柾國裹著睡衣的身影，金泰亨生怕自己被發現又隱隱期待著。

      ⠀

      「哥今天來公司幹嘛。」田柾國撐著頭壓著嘴，聲音提前在他口中化開，「眼鏡忘拿了。」，田柾國從鼻子重重的順了口氣，嗯了聲又陷入沉默。

      ⠀

      在第五個100秒的紅燈過後田柾國開口：「回家吧，煮拉麵吃就好。」，大概是田柾國記得那時候他開口的時候也沒加形容詞，車停入自己家樓下的停車場時他沒有絲毫意外，淡定下了車朝著家裡走去。待金泰亨下車暫定田柾國的身影變得很小很小，他看了很久。直至田柾國沒有聽見預期的腳步聲轉頭，金泰亨才快步跟上。

      ⠀

      他抹了把臉，人在鬱悶時總隨意觸景傷情。田柾國身上顏色總是枯燥乏味的黑色，偶爾在他身上看的其他顏色都是自己給他買或者公司給他配的，可這樣的背影就是過於熟悉與凡庸，讓他一時之間居然恍惚地去想今年是他們出道第幾年了？十二、又好像是十三，田柾國現在大概也要奔三了。是他小時候許願想結婚的年齡。

      ⠀

      也並非提到分開二字，但似乎意思就是那樣了。田柾國想著金泰亨就是個負心漢，怎麼能在情慾過後說分開的話，還是貼在他後頸上說的。金泰亨悶悶地開口，聲音隨著他的骨髓深入他的身體，屬於金泰亨的頻率在他身上裝了辨識器一般挑起他四肢骨髓的神經。他從來無法拒絕金泰亨，就算是這樣的話。但金泰亨彷彿在哭，不過他不想思考那麼多。田柾國不喜歡複雜，比如不喜歡學語言。而聽懂金泰亨的語言是他從小耳濡目染，如同母語一般的，但當時的他覺得金泰亨說出了個生僻字考他，答錯了和答對了，結果都是一樣，所以他如同三好學生為了報復老師一樣幼稚得交了白卷。

      ⠀

      「我們為什麼要分開呢。」他記得金泰亨說，後來的很久，金泰亨遺留下的耳環一直在洗手台上擺著，反覆氧化又被擦拭。田柾國覺得那個耳環也不怎麼重要，否則金泰亨這回也不會不來拿。

      ⠀

      說要吃晚飯，田柾國進了房間卻直奔房間闔上門，他聽見外頭金泰亨的拖鞋摩擦聲忽遠忽近的，後來直接聽不見了。他看著床頭的藥片，此刻他不用那個也可以睡著，可真到了這時候他又不想睡了。想到金泰亨在外面、想到洗手台的耳環、想到門口他的大衣躺落在沙發上，他想念的一切都不合時宜的出現，逼著他不能去想其他的東西。

      ⠀

      其實田柾國想過的，如果不走到今天這一步──沒有如果，他難以去忘記金泰亨貼著他的唇喃喃道「我想起我第一次見到你的時候，我就知道我會愛你了。」想起很多粉絲也這麼跟他說過，又笑他那些人可不會上了自己，金泰亨恃寵而驕一般的黏在田柾國身上撒嬌，說除了自己誰都不許碰你，像極了新人婚禮的宣言，只是少了數不清制式化的“表演”。於此，他思索著愛有太多意涵，他愛他的成員、愛他的粉絲、愛他自己、愛金泰亨，每一個意義迥異的情感都被稱為愛。

      ⠀

      天啊，田柾國難以抑制的去逃避這這一切。他甚至想過如果今天要跟其他成員接吻，不但對方會把自己推開，自己大概也會感到奇怪。可不明明都是愛？所以當他再一次貼上金泰亨的唇，他居然想流淚──背德的快感和情不自禁使得他不斷後知後覺自己的沉淪又再一次陷入其中。

      ⠀

      田柾國覺得自己更應該恨金泰亨的，反之亦然。金泰亨在他連喜歡男生還是女生都還沒思考過的年紀兀自的吻他，沒有少年時期青澀的表白只是隨著時間越來越靠近，不清楚到底是從哪一刻開始脫序。他不得已的去思考，思考著又沒結果，他只是喜歡金泰亨。在那個年齡都還模糊不清的年歲進入了全男性的團體中，他的愛更加心無旁騖。

      ⠀

      而愛也是那樣的，悄無聲息的貫穿人與人本該遠離的心臟直到他們徹底相擁，相擁的代價要人去承擔。當恨建立在愛上，究竟會是什麼表現型態，田柾國則仍然無解，他會在金泰亨吻他時揪緊，也會在他向自己走來時佯裝不在意。偶爾他看著兩人各合照發愣，想著這張照片沒了任何人都不會被自己掛在牆上。

      ⠀

      他去廚房尋金泰亨，看他正在翻冰箱，田柾國現在只覺得胃部痙攣。成員們待在一塊的時候，偶爾會憶起當年一窮二白的時候，七個人分著一個披薩口味還得選最便宜的、吃飯吃來吃去就是公司附近那家便宜量大的湯飯店，而當初確認對方是否在家只需要談話聲和腳步聲，現在廚房的回音都傳不到他房裡。金泰亨則會跟田柾國開玩笑他們像出租屋文學一樣，田柾國就嘲笑他整天想些什麼。

      ⠀

      太多如果，又沒有如果。有時田柾國會想如果沒有金泰亨的話──又不想了。有時候也會在剛被公司警告完的時候問金泰亨，金泰亨就會生氣講些更傷他的話，也不是金泰亨說話多難聽，是他永遠知道說什麼能讓田柾國心裡漲得難受，像那天的分開。

      ⠀

      他貼上金泰亨的後背，後者短暫停頓後手上仍切著菜。太安靜了，整個豪宅都太安靜了，以至於他們能聽見對方徐徐的呼吸聲，一前一後的聽上去有些急促，田柾國突然覺得很想哭。他雖然矮金泰亨一些但也不是那麼多，他將頭靠在金泰亨的後腦勺上嗅到他許久未聞到的一股高級香味混著他記憶力金泰亨總有的一股屬於他難以言喻、於他而言高級又暖和的香味。他發現自己尤其喜歡美麗的人，或他漫漫的歲月中也沒有比起金泰亨更加令他觸動的人。

      ⠀

      從前他只能勾著他的背，哥哥們常感慨田柾國真的長大了很多，金泰亨說他亭亭玉立了，如果真的能夠亭亭玉立⋯。長大的不只是田柾國，整個防彈少年團、包括金泰亨、他們所擁有的一切，野心再也裝不下12年前美國的小舞台，也裝不下他們初見時那小小的宿舍，他們各自住在首爾的精華地段，偌大的豪宅，現在裝不下的剩下他們。

      ⠀

      他們都承認，他們無法捨去現在的一切去換愛情，也無法在成員欲言又止後說、“你們快樂就好。”後心安理得。這樣的感受在他們並肩立足於舞台上時格外清晰，歡呼聲越大他們的“我愛你”就越模糊，最清晰的時候剩下情慾時下意識的索吻。人性是貪婪的，如果他們不貪婪也不會擁有現在所攥緊的一切。

      ⠀

      「你想怎樣，金泰亨。」被直呼名姓的金泰亨想田柾國想問的是“他們還能怎樣。”。如果沒辦法了那這麼曖昧不清一輩子也不是不可以，反正成員默許、公司也無法拿他們如何。

      ⠀

      沒有人忘得了田柾國15歲時的眼睛，像隕落而四散的行星在金泰亨心裡烙下數不清深深淺淺的坑，斑駁的顆粒感太過清晰以至於他每每看見田柾國就想愛他。人總下意識去愛脆弱的東西。田柾國是林中最高聳的那棵樹，他看得到那些在他之下生長的樹木、也看得到遠方屹立的高樓。年少成名掩蓋不了他脆弱自卑的本質，金泰亨和成員們都樂在用愛滋養田柾國成長的過程。

      ⠀

      可金泰亨想吻他，那是不一樣的。當他對田柾國已經難以用哥哥對弟弟的呵護來包裝，他首先感到自責，因為他明白田柾國不會拒絕他。而某天晚上腦子一熱金泰亨吻了田柾國，後者只是緩緩閉上眼睛默許一切發生，田柾國想著：這一次就好。可這句話從來是人類自欺欺人的謊言，擁有了就要更多、更多了就要更好、最後會希望只屬於自己。

      ⠀

      金泰亨回過身，他被田柾國圈在流理台邊緣，他覺得田柾國在哭泣，沒有眼淚的、在心裡嘩啦啦下著的那種，彷彿在跟記憶中台下的歡呼聲比拼。他此刻多希望田柾國就大哭一場，金泰亨就會吻去他的眼淚，緊緊抱住他，上演一齣兄弟情深的大戲。

      ⠀

      他覺得很多事情變了，包括他從厭倦苦澀的黑咖啡到愛上熱烈的威士忌，被那些清高的品味包裹住的是他無能為力只能在醉意裡逃避的人格。他跟朴智旻喝酒喝到深夜，借著酒意，他說他很痛苦，愛不是應該讓人感到快樂嗎？為什麼他們都那麼痛苦，他還說對不起。朴智旻眼裡的酒意間閃過一絲憐憫，飲盡了杯裡的威士忌倒臥在地板上而杯子與桌面的碰撞聲不斷迴盪。他們七個都太痛苦了，倚靠著那痛苦過後的一絲絲曙光看清楚前路爬行著。以至於金泰亨說出他痛苦時，他居然有種恍然大悟的感覺。其實不痛苦的，但愛總是能讓人在微小的幸福和壯大的後果中選擇甘之如飴。

      在他發現田柾國感到很痛苦的時候，他覺得田柾國不應該那麼痛苦的。

      ⠀

      這時金泰亨才今天第一次認真端詳田柾國，他瘦了、眼袋深了，已經不是上次見面那個惹人憐愛的模樣，但金泰亨還是清楚意識到他的靈魂無論如何都會奔向眼前人身上的每一寸。他想吻他又想摸他的臉確定他是不是真的瘦了許多。

      ⠀

      田柾國從來不喜歡忍耐，高自尊的他又不喜歡去求什麼，他們相顧無言，爾後他垂首抵住金泰亨的胸口。他一直都拿金泰亨沒辦法，恨不徹底剩下愛在奪去他的感官，他都忘了他現在仍因為金泰亨提了分開而感到不悅，他又把頭埋在金泰亨肩膀上環住他的肩，金泰亨才大發慈悲的抱住了他，幾乎是沒有空隙的。

      ⠀

      「我恨你。」田柾國喃喃道，他去吻金泰亨的下巴和鼻尖，到了嘴唇，他將田柾國重重的推到對面的櫃門上摟著他親。這時候到底是叫重蹈覆轍還是破鏡重圓？他們不知道，但田柾國覺得這樣就好。

      ⠀

      田柾國主動去撩起金泰亨的衣服，換來金泰亨更加變本加厲的直接去解他的襯衫鈕扣。金泰亨突然覺得他們像爛俗的古早小說，什麼矛盾都靠做一場解決，礙於他實在想不出其他該做的了。面對面吃一頓飯？別傻了，能好好吃完一頓飯才怪。金泰亨來找田柾國根本就沒想過要幹嘛，吃飯沒想過、要做一場也沒想過，他覺得見到了田柾國總會有辦法的。

      ⠀

      他停下來凝視著田柾國的臉，比起小時候黑了、沒那麼容易顯臉紅了，但眼裡還是藏不住事兒，迷離的眼神和游移的目光，田柾國此刻覺得自己真像待宰的羔羊。沒成想他只是伸出手摸摸田柾國的臉，在他臉上的每一處都像在點燃星火殆盡他在金泰亨面前所偽裝的一切，不自覺就紅了眼。他握住金泰亨的手放在臉前像在虔誠的許願，又帶著去捧自己的臉，爾後細細的親吻，張口就含住了金泰亨落在唇邊的食指和中指，軟綿的舌在指尖穿梭，口水很快就沿著他骨節分明的指頭淌流到他掌心，田柾國又慢慢抬眼。金泰亨真的覺得自己要瘋了。

      ⠀

      每一次都是這樣，在金泰亨以為他佯裝好他的好哥哥形象時，田柾國總是一點點的引導他，像拿捏住自己肯定無法控制住自己不去隨著他的願。他卻自私的想這樣也好，顯得他不是那樣自私顧著愛而罔顧一切的人。在歲月的洪流中他們都變得小心翼翼，深怕下一步便是萬劫不復。

      更多時候他們會不理智的覺得，有對方就好，就只是一瞬的，有時候他們都嘲笑自己。

      ⠀

      手指抽出而牽引出的口水絲掛在他水盈盈的唇瓣上，又被金泰亨吻到口中，金泰亨一手摟著他一手帶著他的唾液探到他後穴。田柾國覺得他的門牙差點就要撞上去了，依然雙手圈住金泰亨的脖頸唯恐眼前人下一秒便會散去，他眼中溢出了一些淚花，眨眼間他看到金泰亨眼尾似乎也有液體在滾落。

      ⠀

      客廳的落地窗正對著外頭，從前被私生騷擾留下的創傷讓田柾國決定選擇隱密性高的別墅區，他隔著金泰亨的頭看出去，外頭靜謐而幽深的夜色在他眼中化開來自他眼頭滑落。太安靜了，像全世界只有他們一樣。

      ⠀

      金泰亨把手抵在田柾國肚子前不讓他直接撞在流理台邊，可田柾國覺得第一次他就要散架了，大理石流理台上都是他的淚和唾沫。他趴在桌上說不清是疼還是爽更多，總而言之他說不出任何有意義的字句，只是一味地呻吟和哭。

      ⠀


updated: 2026-11-01
summary: 尷尬前任（或不是前任）
status: finished
chapters:
  - body: |-
      
      ⠀

      金泰亨坐在沙發上，田柾國雙腿曲起背靠著他下巴倚著自己的膝蓋滑手機。夜深了兩個失眠的人在客廳撞見，另一個看著電視，點了影片卻在開頭一分鐘內就會跳開，這麼循環了有十分鐘以上，到田柾國聽著也發現不對勁目光移到電視上才看到哥哥對電視上的內容一點興趣也沒有。

      ⠀

      可他也沒什麼頭緒，推特上滑到早期的舞台切片，看過去了偶爾回憶起他們年輕的時候──也不是現在不年輕，比較起來的話當年還是比現在青春不少的，想起那時候在做些什麼、還有那時候的金泰亨。換到其他的軟體上也沒什麼令他好奇的內容，手指頭只是下意識的上下滑動實際上他也沒看進去什麼東西。

      ⠀

      他轉過身去和金泰亨肩並肩坐著，也開始看電視裡頭徘徊不定的內容，驀地金泰亨把遙控器遞給他：「你要看嗎？」田柾國其實也沒什麼想法，還是接過了遙控器，最後實在沒什麼想法挑了張沒聽過的專輯點了進去。

      ⠀

      田柾國把遙控器扔到一旁去也沒讓金泰亨有選擇權。他洩了力發覺後頸是金泰亨的手臂，那人發覺自己往後靠就自然的喬了個舒服的位子給田柾國靠著。

      ⠀

      音樂聲不大不小，大的讓他們聽得到、又小的不會吵到房間裡睡覺的成員們，可田柾國卻還是覺得空間安靜的嚇人，悠悠的爵士樂陪著空調的嗡嗡聲在他耳邊循環，靠近金泰亨的那邊還有那人規律平靜的鼻息。他歪了歪嘴，這種氣氛居然都沒有讓他昏昏欲睡，反而格外精神的捕捉空間裡的細小雜音。

      ⠀

      金泰亨靠過來，細小的碎髮蹭著他的側臉使他發癢，他以極小的幅度躲過，又感覺金泰亨的唇瓣貼在他的小耳朵上，只是一個極輕的吻，落在耳畔周圍卻只能聽見耳朵被輕壓的沙沙聲，爾後吻落在他的側臉、又一個，每一個都更靠近他的正臉，又在他幾乎沒有的酒窩處一再重複，重複到田柾國感覺臉上都有些濕潤的涼意。他退開一點距離轉過頭，「什麼？」垂下眼去看金泰亨半掩下的雙眼，金泰亨的眼睛大的就算如此也能看清他的黑瞳和眼瞼上的痣。那人嘴上笑意極淺，幾乎沒有，田柾國也不知道自己怎麼看出來的。

      ⠀

      田柾國感覺每次和金泰亨這麼對視時間都像停了一樣慢，明明才過了幾秒鐘他卻能像過了幾個小時一般思緒萬千。有時候他會想金泰亨的下一步，吻他嗎？抱他？有時候會不合時宜的問些困擾他許久卻沒敢開口的問題，像金泰亨手上多的疤、或他們不在一起時金泰亨沒跟他說的去處。也有些時候，會想些煽情的，像他們現在到底算什麼。

      ⠀

      哥。他沒想好說什麼卻又被沉默的尷尬困擾時，總會下意識喊哥而模糊掉稱呼。

      ⠀

      入伍前那會兒，到了某種時刻，誰開得口已經不能代表什麼，因為一方開口、另一方的默認跟開口也沒兩樣。可奇怪的是他們卻矢口不提，說分手像先行承認了他們這種不明不白的關係是所謂戀愛關係，有些矯情又俗氣。所以金泰亨說：「這段時間，照顧好自己。」而田柾國說知道了。

      ⠀

      進了特種兵軍隊的金泰亨比起田柾國又更忙一些，休息時間也常對不上，導致他們也沒刻意做到保持距離，距離就像隔了好幾個國家一樣。最近的時候還是在其他成員裡口中得知了對方的近況。金泰亨適應的很不錯，田柾國只是點點頭說很好。

      ⠀

      金泰亨一如既往的是那樣善於與人交際與適應新環境，田柾國預料得到。他絲毫不感到意外，金泰亨會過得好也是他意料之中，對此不感到欣喜也不怎麼難受。因為和朴智旻同伴入伍的緣故他也過的不錯，依賴哥哥的習慣延續到了隊伍裏頭，而田柾國也發覺自己只是下意識的依賴身邊靠近的哥哥。

      ⠀

      因為總能在成員口中得知對方的近況，導致他倆的對話框安靜了足足三個月之久，直到有一天晚上田柾國看到金泰亨早上傳來的訊息。“過得好嗎？”“智旻也還好嗎？”

      ⠀

      “智旻哥還有點不適應，不過都還好。”田柾國回覆，“都還好”回得太模稜兩可，主詞包含了朴智旻也包含了他。田柾國矛盾的希望金泰亨不深究又希望他多問幾句，而對方沒有馬上回覆。隔天才收到回訊：“那就好，照顧好對方。”。田柾國也沒再回覆。

      ⠀

      那就好？好嗎？⋯好吧。他們偶爾這麼有一句沒一句的問對方的近況，到了中期大家穩定下來總算能以抽空聚餐才見到面，成員們理所當然的把靠著的位子留給他們，他們也沒抗拒的坐在了一塊。

      ⠀

      而退伍後的沒多久他們在拉斯維加斯重新聚在了一起，變了的沒變的都是定數了，七個人只是重新習慣著七個人的生活，唯獨對兩人的近況保持著微妙的存疑，而他們不問金泰亨和田柾國也當沒這回事。

      ⠀

      「什麼？」田柾國問他，又補了句哥。金泰亨沒應，田柾國腦海裡跑出V哥和泰亨哥兩個詞彙，突然間躊躇著該怎麼喊。「什麼？」金泰亨停頓後重複，田柾國突然之間像被看破了一樣窘迫。從前他總喊金泰亨泰亨哥，金泰亨也愛聽，taehyungie hyung 四個音節念在田柾國甜膩又撒嬌，團裡也只有他會這麼喊金泰亨，自然而然被當作愛稱了。

      ⠀

      可現在呢？就算不作為愛稱，這個稱呼也沒有任何問題，就是很正常的弟弟喊哥哥。可田柾國現在就是喊不出口。田柾國退伍後總喊金泰亨V哥，金泰亨聞言一愣，又佯裝自然的回首，像明白田柾國就應該這麼喊他。

      ⠀

      想到金泰亨剛剛吻他，他自然而然地脫口而出「泰亨哥。」，此時的金泰亨反而怔住，田柾國才輕而易舉的看見那幾乎不存在的笑意更深，「嗯？」他語調上揚表疑問的嗯了聲，田柾國尋思著不是他先問了問題嗎。

      ⠀

      不過他也無心去想這個，他緩緩湊上去不急不徐的貼上他的唇面，小舌舔拭過唇峰又竄進那人的口中，水聲滋滋的蓋過電視的音樂，田柾國抽開手抬起落在金泰亨的肩膀上。每一個舌頭的碰撞都小心又細緻地舔過，口水在唇與唇之間流動而不溢出，他們都吻的極其仔細。

      ⠀

      「坐上來。」田柾國聞言扶著金泰亨的肩膀順勢抬腿跨過金泰亨的雙腿，雙膝跪坐在那人大腿兩側的沙發，又迫不及待的低下頭去尋金泰亨的微微張開的嘴。

      ⠀

      一切都太過於熟悉，金泰亨覆上他的胯骨，田柾國雙手自然的放在那人壯碩的雙肩，這是不管他們入伍前還是當兵當中都極其尋常的姿勢。

      ⠀

      田柾國感受到金泰亨總是跟著自己，他伸出舌頭金泰亨就順從的張開嘴，他在金泰亨脖頸後的雙手收緊、金泰亨就摟緊他的腰，恰到好處得讓田柾國沒什麼好胡思亂想的，卻又讓田柾國覺得這不像他──他是誰？入伍前的金泰亨和現在的金泰亨是同一個人嗎？

      ⠀

      田柾國總覺得金泰亨是最適合巴黎的人了，他們少有幾次機會能一起走在巴黎的街道上，金泰亨雙手插在大衣的口袋，棕色的布料同他當時金棕色的髮色，散發毫不違和的英氣和靜謐，而在大衣口袋的手臂曲起，只要金泰亨一個回眸田柾國便心神領會那個位置是留給自己的。

      ⠀

      其實哪怕金泰亨不回頭，他也知道。他挽住金泰亨的手臂，那人胸前掛著一台田柾國已許久未見他拿起的萊卡相機。夜裡的巴黎街頭不算多安靜，有著西方自由與外放的熱情殘留，可每個人都關注著自己的事情，於是他們能這個肆意的走在路上。那時候的金泰亨問：真不知道下一次這種日子是什麼時候。田柾國笑著問哪種。哪種？嗯⋯四月的巴黎、我和你、這樣閒來無事的走在路上。他沒有特別說，其實重點是第二個。田柾國點點頭，短暫的歪頭靠在金泰亨的肩上。

      ⠀

      現在的金泰亨還會執著於這個嗎？四月的巴黎、我和你、閒來無事的走在街道上。但也許當別人問起，他們也只能介紹身邊是自己的團員。

      ⠀

      田柾國眼睛睜開一條縫隙，見金泰亨緊閉的雙眼與低垂的眼睫，有一下沒一下的輕顫。他盯得愣神，甚至沒來得及意識到逐漸失去節奏的唇舌交纏，直到金泰亨的琥珀色瞳孔撞進他的目光他一驚，響起金泰亨低沉的嗓音：「你分心了。」。

      ⠀

      幸好金泰亨沒問他在想什麼，不然他也回不出來。他像孩子被抓到上課畫圖一樣趕緊收拾了表情和心情，莫名緊張的等著金泰亨再次發話，而金泰亨只是指出了他的問題，又歪頭繼續下去了剛才的吻。

      ⠀

      好奇怪，田柾國莫名升起一股怪異。他們之前也接吻，有輕盈點水的、也有作為前戲所以激烈的，都沒有像今天帶給他一種毫無來由卻無傷大雅的奇特。

      ⠀

      他甚至沒感覺到金泰亨身下起了任何反應，而自己居然也沒有。好像這樣的親密不代表什麼，就只是兩個人用行為傾訴無聲的情感。直到很久很久誰都沒有先行停下，主唱的肺活量甚至能讓他們暗自較勁。

      ⠀

      良久他們彼此分開，田柾國還沒看清金泰亨的臉那人就埋到自己肩窩大喘氣，頓時不合時宜的想笑，接吻的急切像被誰追著非得贏過什麼，而他只是把手伸到金泰亨的後背上下撫摸給他順氣。

      ⠀

      「泰亨哥。」田柾國也低下頭去，嘴巴貼著金泰亨肩頭的布料悶悶地喚他，他不期待著任何回答，只是想喊他一聲罷了。

      ⠀

      現在是什麼時候？他想，居然是退伍後的他們，在拉斯維加斯的別墅裡擁吻。他想起過去哪怕任何一次，這麼無聲的只是在一起而沒有任何性調和，他們總在性裡逃避溝通──田柾國投降的去想，這時候的他反而格外有勇氣承認他們就是在逃避。

      ⠀

      直到性對他們來說已經習以為常到他們甚至不感到尷尬，事後的清晨也能自然而然的給對方揉腰和清理，甚至還能報備幾句今天各自的行程。到了這個點上他們逃避的話題也不再需要溝通。

      ⠀

      田柾國想起之前在宿舍自己內向的不敢去洗澡，金泰亨就主動問他洗澡了沒；到了後期金泰亨總愛摟著他睡覺，說這樣有安全感，其他哥哥都不給他抱──是因為他們不給你抱你才抱我的嗎？他沒問出口。又更後來他們互相解決慾望，途中因為氣氛剛好順理成章的接吻，發現嘴唇的觸感在手中和嘴裡截然不同，而在遙遠的後來他們對性和愛的理解都只來自於對方。這時候田柾國也不會神經的想問他是不是和其他哥哥不一樣了。

      ⠀

      直到他們因為入伍所以分開，田柾國才發覺關係對他們來說一點意義也沒有。思考他們是什麼、與思考未來沒什麼差別，今天沒有答案、明天沒有答案，都無傷大雅。而金泰亨在他心裡的位置，本就沒有其他選項，一盒餅乾裡只有一個口味，就不用大費周章的分類。

      ⠀

      「想睡了。」金泰亨悶悶地開口，田柾國嗯了聲，金泰亨托著田柾國的大腿站起身來，朝著他的房間走去，田柾國的反應被金泰亨當作默認了，反正他們的房間都是雙人床。

      ⠀

      「你明天什麼安排？」金泰亨的聲音在田柾國頭上響起，田柾國閉起眼睛無聲的考量著金泰亨的問題，最後還是回了句不知道。好像明天是他們最遠的未來，可會有很多個明天、很多個一樣的明天。金泰亨聞言沒再開口，收緊手臂讓田柾國更加貼近自己。

      ⠀

      逃不過明天的，金泰亨想著，他也不是真的好奇明天田柾國要幹什麼，只是未來能讓他對今天更有實感一些，而更遠的未來成為他們之間默認的懸念，他沒打算破壞這個平衡，反正很多個明天過後就是未來了。

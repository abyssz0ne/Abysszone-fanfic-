title: 而立
cp:
  - 泰正
updated: 2026-11-01
summary: 可我愛著你的一雙眼睛，那旋入一切所見的瞳孔，如洗衣機滌淨一切，你的熱愛、你的理想，和我望向你，混著泥濘的雨露。但在你的熱愛與理想之後，才是我，你說你沒力氣了，你閉上眼，陷入沈睡。他居然是此刻才意識到，窮盡一生也無法追上某個在不特別的午後，溜走的簡單而純粹的愛。
status: finished
chapters:
  - body: |-
      

      分開的那天把難聽的話都說了個遍，或者嚴格來說只有金泰亨這麼覺得自己。田柾國怔怔的坐在沙發上盯著地毯上毛茸茸的紋理聽自己說話，眼淚不停的滑落他白皙的臉頰，卻愣是一個音都吐不出口，只會在金泰亨說分開好嗎過後說不要。

      ⠀

      小國，我不想看你這樣痛苦。金泰亨說，話畢又啞住。田柾國抱著腿的手似乎有一瞬間顫動被金泰亨捕捉。我不痛苦。他說，抬起手臂擦了擦眼淚。

      ⠀

      金泰亨蹲下去接過他的手，露出手腕上的疤，拇指指腹摩娑過斑駁。他該說的話在過去的說過了，現在一句話也說不出口，說了也是白說。

      ⠀

      分開了我會更痛苦的，金泰亨。他喊他，金泰亨不敢抬頭看他眼下的黑和眼裡的腥紅。在他大半夜失眠之際接起田柾國的電話說他在樓下，衝下樓的第一眼他就看得很清楚了，他把人摟進自己的大衣裡語無倫次的問等了很久嗎？你來多久了？田柾國說不知道。

      ⠀

      金泰亨啞口無言，他雙手抓著田柾國低下頭流淚。那天他喊了很多次小國，田柾國喊了他很多次金泰亨，金泰亨記不清最後他們是怎麼迷迷糊糊的睡一塊了，只記得他說他也累了，田柾國沒有再回話。

      ⠀

      隔天早上他送田柾國回家，在車庫裡無言許久，直到田柾國開口問他：真的就這樣了嗎？他嗯了聲，田柾國說好，不怎麼輕的甩上車門。金泰亨駕輕就熟的離開田柾國家的地下室。

      ⠀

      金泰亨蓋過手機螢幕，田柾國自那天過後封鎖了他個人的訊息框，金泰亨隱隱覺得這是賭氣似的行為，卻由著他這麼做了，主要提分手的人沒有什麼資格去管被分手的人究竟要如何處置自己，他也沒有不要臉的去說分手後還要做朋友。

      ⠀

      他們不用做朋友團隊就會將他們死死綁住，做朋友顯得欲蓋彌彰還顯得他多放不下。田柾國怨他沒有絲毫不捨。他想過很多方式，假裝自己不愛了、辜負他、出軌之類的俗套劇情，最後在腦海裡一個一個駁回。

      ⠀

      他想過什麼是對田柾國傷害最小的，預演過田柾國聞言後的反應。結果果不其然那個只對自己有小脾氣的弟弟像隻兔子一樣暴躁的大喊不要，湊過來咬自己的嘴和身上，兔牙鑿的他身上都是紅印子。隔天成員們看到以為昨晚兩人又恩愛了，殊不知是大吵了一架。

      ⠀

      田柾國見金泰亨冷靜地看著他發瘋萌生被輕視之感，狠狠咬破了金泰亨的嘴惹得他吃痛悶哼，抽出金泰亨情不自禁竄進他腰間的手，奮力推開那人轉頭甩下「滾。」後轉頭回了房間，啪的一聲關上門。留下金泰亨一個人狼狽的收拾東西離開田柾國的住處。

      ⠀

      金泰亨手背擦去下垂被咬而流的血，血滴在顫抖的手上留下一條血跡。要是平常他肯定會心軟的走上去說對不起。可金泰亨在此之前像下定了什麼樣的決心覺得這次必須是最後了。

      ⠀

      他坐在餐桌前與父母對坐，銀色的湯匙印出他藍色的頭髮規矩的散落。你和柾國最近還好嗎？金泰亨的手在菜盤上方釘住，深吸一口氣卻無言的收回筷子。頭頂似乎被兩雙熾熱的目光鎖定惹得他不敢抬頭。

      ⠀

      他想起前幾天他和田柾國單獨被叫到辦公室，自己站在玻璃門外看著田柾國背對著他規矩的站著，自己在門口頓了一下才打開門與田柾國並肩站著。金泰亨雙手插兜，高高抬起下巴盯著坐著的高管，聽著他聽了無數次都覺得是廢話的內容。

      ⠀

      你們兩個這樣的時候，想過其他人嗎？作為團體不能那麼自私。你們真的知道被發現的後果嗎？你別那樣看我，出事了你們自己會來求我幫你們擺平。分手，不然給我其他更好的選擇。金泰亨偷偷瞄了一眼田柾國，那人低下頭一言不發，偶爾眨了眨那雙大眼睛，那雙眼睛大的藏不住事，稍稍突出的眼球像隨時會滴下淚水，金泰亨被他的想法怔住。

      ⠀

      他們一言不發地走在長廊上，像過去無數次的那樣，只是金泰亨看著田柾國低低垂著的後腦勺嘴裡發苦。他一直知道田柾國很難受，知道他因為自己在鏡頭前放縱過後迎來訓話會無數次的流淚，甚至知道田柾國手上被刺青蓋過去的疤有多少是因為自己。

      ⠀

      而他好像一直以來都在佯裝不知情，直到他發覺每當看見田柾國的眼睛就覺得他在流淚。

      ⠀

      他知道田柾國失眠，卻從未探究過他失眠的原因，好像原因處在他們之間的盲區，不停的為對方找藉口，自己的失眠只是一次的精力旺盛。直到他們一起失眠，假裝不好奇原因。

      ⠀

      田柾國好久沒傷自己了，他說那只是他當年幼稚不懂好奇做的，現在不會了，真的，他再三保證。田柾國太能忍痛了，受傷縫針、骨折，那些聽上去毛骨悚然的傷在他口中像氣象報導一般平常，金泰亨不合時宜的想果然兔子很能忍痛，但明明可以不痛的。

      ⠀

      他不流血了，刺青流暢的深色線條劃過他的手臂，金泰亨卻覺得那還是田柾國的血，咬著流露出血腥味，自己卻再也不能過問那些痕跡的理由，好像那成為了藝術。

      ⠀

      想到這金泰亨不知道該如何回覆他的父母，幾年前的坦白和家人大吵了一架，離開過後父母親總逃避著話題，好像不提起就能當作無事發生，只是他偶爾能在轉角聞見父母的談話聲和凝重的神態，如今他們正面問起自己仍啞口無言。

      ⠀

      於是他只是嗯了聲，放下筷子自顧自的收起了碗盤，在流理台用吵雜而連續的水聲掩過腦海裡雜亂的跑馬燈。他躺在床上，看著手機裡被封鎖的對話框，不知不覺液體從眼頭流過山根，如山巒小溪流過，他的眼前升起霧靄使他看不清對話框裡頭的內容，直到黑屏。

      ⠀

      我們分開吧，對我們大家都好，不是嗎？金泰亨說。田柾國好像不可置信的擰眉，聲音堵在喉嚨發不出，金泰亨仍不敢看他。

      ⠀

      第一次交談不歡而散，金泰亨彷彿抓到了浮木，低氣壓自然而然地讓兩個人的距離漸遠，闔上門他能盡情的流淚和痛苦，開了門他便是一副冷靜的模樣，氣得田柾國甚至不願意跟他吵架。偶爾下意識地湊近也會被金泰亨冷眼退回，田柾國有苦難言只得窩囊的封鎖了金泰亨的個人訊息。

      ⠀

      有些距離一旦跨越就難以退回正常範圍，金泰亨這麼想，他奢望過退回乾淨的隊友關係──沒有乾淨不乾淨的，只是他總覺得他們像一座花園的花草，晴空萬里時負責美麗，大雨澆灌時便渾身泥濘，染著四周不同的花朵也跟著混濁不堪。他們退一步是毫無關係，進一步又逾矩。

      ⠀

      金泰亨想讓田柾國別那樣看著他，矛盾的想若田柾國能真的恨他就好了，用那雙裝滿星星的眼睛朝自己投射，星星的尖銳會刺穿他，審判他犧牲的罪名，換他血流不止。

      ⠀

      田柾國後來出現在自己家樓下哭著說他不要分開，金泰亨還是落淚，擊破他無數次背著田柾國築建起的防禦，實際上田柾國的每一滴淚都能腐蝕他因為成長逐漸強壯麻痺的心臟使它變得敏感而脆弱，直到田柾國的淚直直擊中他內心最難以熟透的莽撞，他還是會去擁抱他。直到清晨理智回籠，他仍然在田柾國面前佯裝起理智的成年人，能夠為了利益而放棄一切的成年人。

      ⠀

      真的就這樣了嗎？

      嗯。

      好。

      ⠀

      可翻過一張照片，就能當作沒有發生過嗎？看著相片紙背後的logo好像無關緊要的一張傳單，翻過去又是被逼著不能面對的過往。田柾國覺得被金泰亨掐著手腕，不被允許翻開那張照片。

      ⠀

      他想掙開，手腕卻發疼，轉過來去看一條一條未癒合的疤。金泰亨你弄疼我了！他大喊，金泰亨翻過他的手去看他手腕上的痕，他摩娑斑駁的疤，見田柾國一動不動的，絲毫不懷疑田柾國控訴的真實性。

      ⠀

      疼嗎？金泰亨想確認，確認上面一條條的痕跡是哪裡來的，疼嗎？是為了我嗎？因為我所以你受傷了嗎？

      ⠀

      對不起。金泰亨說，凹陷的疤痕被風化得麻痺，田柾國卻感覺金泰亨沒有感到絲毫歉意，他的心疼是真的、難受是真的，唯獨歉意像被壓著的相片。金泰亨放下他的手，一去不回。

      ⠀

      田柾國在酒吧裡買醉，全身黑色的套裝包裹住他。到了下半場酒意上頭他脫下了漁夫帽，客觀姣好的面容讓人就算無法分辨眼前人的身份也格外被其吸引，田柾國左邊站著朋友，右邊是一群跳舞的陌生人。

      ⠀

      朋友笑話他終於放下了偶像的包袱和哥們出來了，他笑著拍掉那些人勾在他肩上的手，眼神掃過舞池卻被某種感受擒住不放，低頭吸著不知道第幾杯的調酒。

      ⠀

      手機放在桌面上黑著屏幕，田柾國沒有絲毫期待卻偶在空閒時看向它。知道不會有任何他想要的訊息跳出，在他實在氣不過封鎖了金泰亨的個人聊天室過後更不可能。他摸了摸頭，腦海裡浮現金泰亨道貌岸然的神態和佯裝神情的雙眼。記不清把漁夫帽丟到哪去了，霓虹燈照得他雙眼一晃一晃的，煩躁感襲來，他掐著大腿肉保持清醒。

      ⠀

      嘿，可以請你喝一杯嗎？田柾國從回憶裡抽離，一名陌生男人拿著酒杯朝自己說。那人比自己嬌小一些，染著好看的金棕色短髮。田柾國瞇眼審視著他。那人沒有被嚴肅的眼光勸退，只是接下去自我介紹。

      ⠀

      田柾國禮貌地點頭，說了朋友還在旁邊，他正要離開。那人識相地點點頭，說我常來，隨時找我。田柾國目送那人的背影離開，因為酒醉連打開手機螢幕都手指都在發顫，眼前糊成一片，他迷迷糊糊的就打開封鎖欄解開了金泰亨的封鎖，毫不猶豫的撥了電話過去。

      ⠀

      嘟──好幾聲提示音落下，正當田柾國就要掛電話提示音停了，然而也並無其他聲音再續上。仔細聽能聽到對面稍重的鼻息，金泰亨則聽到了對面吵雜的音樂聲。

      ⠀

      哥，我喝醉了，來接我。田柾國說，他脫力的靠在高腳桌上，聲音聽上去格外慵懶。你在哪？金泰亨問他，田柾國如願報了個店名，是有一段距離的酒吧。對面迎來沉默，田柾國也不急。金泰亨會接他電話已然是意料之外，然而正當思緒飄遠對面開口。

      ⠀

      我讓經紀人去接你。金泰亨說。田柾國攥緊手機的手一震隨即泛白。金泰亨，我們應該還是隊友，對嗎？對方卻只是重複著，我讓經紀人過去。

      ⠀

      田柾國掛斷電話的瞬間還沒從中清醒，好像一個巴掌從幾百里外搧到了他的臉上。金泰亨拒絕了他，毫不猶豫的。俄頃他自嘲的笑出聲，腥紅的眼卻難以掩去他剛被狠狠摔在地上的凌亂。

      ⠀

      他說服過自己無數次這次會像過去的每一次被他們模糊的帶過回到從前，直到金泰亨無數次的冷眼凍起了他伸出的手，讓他在惡寒中獨自吞下眼淚，他的眼淚在金泰亨那竟也變得不值錢，田柾國想。

      ⠀

      他目光飄遠，落在那顯眼的、眼熟的金棕色短髮男人身上，他幾個跨步過後伸手握住那人的肩頭，那人正神遊的心緒被抽回，看見那個人是方才自己搭訕失敗的人時笑開了懷。又見面了，他說。

      ⠀

      嗯，又見面了。田柾國回道，又跟櫃台點了杯烈酒，轉過頭去用醉意掩蓋紅透的雙眼隱含的悲愴。他抿了口酒轉頭看見那人羞澀地看著自己，一下沒一下的攪動杯子裡頭的水果。

      ⠀

      金泰亨望著被掐斷的通話，撥通了經紀人的電話，幾分鐘後他坐上經紀人的車朝田柾國的那間酒吧開去。門口卻見不到人，經紀人進了酒吧裏頭找也見不到田柾國的身影，抓著有些眼熟的朋友問，朋友們也只是怯生生的說他早走了。

      ⠀

      金泰亨正想打開手機問田柾國去哪了，不是要接嗎？手機螢幕亮起田柾國傳來照片，金泰亨不自覺地背脊發寒，顫顫的點開訊息。

      ⠀

      田柾國接近清晨昏昏沉沉的打開家門大門，按號碼的手胡亂的按錯好幾次，試了三兩次才得以開門，踏進門剛將鞋子踢遠，黑色的身影從裡頭竄出，擒住他的手腕幾乎暴力的把他拉扯著回房間。

      ⠀

      他被重重摔在床上，兩手被金泰亨狠狠壓在床單上。「去哪了，那是哪裡。」田柾國知道金泰亨說的那，是他幾個小時前傳給金泰亨的、在半個城市外的旅館拍的照片。左上角的椅子上坐著一個金棕色頭髮的人，明顯不是金泰亨所認識的任何甲乙丙丁。而在照片近乎算是刻意顯眼的中下方，隨意的擺著保險套和潤滑液。

      ⠀

      「用的前面還後面？」金泰亨沉著臉，眼底的慍怒究竟多麼洶湧田柾國能從手腕上的壓迫感窺知，田柾國仍饒有興致的回應：「我們分開了，跟你有關係嗎？」金泰亨眉頭皺的更緊，田柾國從中得到一絲慧黠的快感，雙手摟住金泰亨的脖頸。

      ⠀

      「要做嗎？好久沒跟哥做了，他說我後面緊得不行，吸的他好爽，剛進去一半的時候他差點沒忍住射了，說我叫的也很好聽，哥要不要再試試？」他說，期待金泰亨臉上佯裝的平靜被擊破，「還是哥想被我操，我都可以。」那人卻只是深深的瞪著自己不發一語，田柾國笑意漸淡。

      ⠀

      他瞇起眼睛，轉而看向金泰亨的唇，「我就是個同性戀，改不掉的。」他抬起膝蓋，輕壓著金泰亨的胯下，他能隱隱看見那稍稍隆起弧度。

      ⠀

      「你沒試過，怎麼知道改不掉。」金泰亨發話，田柾國表情微動，儼然沒想到金泰亨會回覆他這句話，倏地有些惱羞抬了抬下巴，「你改過嗎？改掉了嗎？你硬什麼？」

      ⠀

      「有病似的。」他們面面相覷誰也不讓誰，擰著眉頭面色猙獰，田柾國眼眶發酸眨了眨眼，眼前的人舔了舔嘴唇像要發話，惹得田柾國不自覺繃緊身體。

      ⠀

      然而金泰亨的眉頭驀地鬆開，起身冷冷的盯著躺著、手還停在半空中的田柾國，雙手插進兜裡，舔了舔乾澀的唇嘆了口氣。

      ⠀

      「爽的話你去找他吧。」他說，「我不是為你硬的。」

      ⠀


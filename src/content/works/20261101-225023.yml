  「會有很多你無法原諒的人出現，二十歲之後，也包括我，是吧？」

  「我以前很內向，是V哥帶我走出內向的。」
status: finished
chapters:
  - body: |-
      

      ⠀

      /

      ⠀

      田柾國開車經過鄰近舊宿舍的桑拿房，發現外頭已經貼滿了出租傳單。鬼使神差的他把車靠邊，踩著冬天結冰的地，縮著身子走上前去。那根門口旁的電線桿上13年那會兒還貼著零食的廣告傳單，金泰亨說看起來很好吃。天冷的、雪下著，他們相互摟著才勉強不會冷的發顫，踉踉蹌蹌的去超商買了包傳單上的零食，幾年過去那張傳單已經變成乾掉的白色油彩隨意塗上去的一筆。

      ⠀

      他拍了張照片傳到大群組裡頭，金南俊感嘆著當初他們最愛一起去的桑拿房居然關了，金碩珍問什麼時候啊？不知道，沒有人知道。田柾國看著群裡說起了過去的事情，淡淡地看著不斷刷新的訊息。

      ⠀

      “我和柾國之前在那打過雪仗，對吧？”金泰亨回覆了那張圖片，金碩珍傳來：“呀，原來你倆一起去過，要柾國跟我去他都不去結果跟你去了。”金泰亨回：“很意外嗎？”

      ⠀

      金泰亨點進照片，看著那根電線桿升起莫名的熟悉又說不上來。田柾國那時候太內向，其他哥哥要約他什麼都會被他低著頭顫顫巍巍的拒絕。被金泰亨半逼迫的習慣團體生活，於是乎後來田柾國要金碩珍請他吃飯被後者一口答應下來，問他還要帶誰一起，他毫不猶豫說泰亨哥。

      ⠀

      他和金泰亨形影不離，成員要找田柾國就會問金泰亨、要找金泰亨也會找到田柾國。直到後來甚至習慣了兩人從對方的房間穿著對方的睡衣出來，起初是閔玧其問金泰亨你倆怎麼最近總睡一塊？金泰亨欲言又止，說昨晚聊天聊到睡著了，問他聊什麼又說不出個所以然。而田柾國只是悶著頭吃早餐，那會兒田柾國剛成年。

      ⠀

      其實他們搬到宿舍擁有自己的房間後，他們就經常出現在對方的房間，然而閔玧其卻第一次這麼問。金泰亨抬頭回望閔玧其一瞬，後者低頭抿了口咖啡。田柾國知道閔玧其要問的肯定不是這個。

      ⠀

      第一次是田柾國毫無預警的推開金泰亨的房門，那台筆記型電腦上播放著男女的歡愛景象，金泰亨轉過頭去一怔，正當他窘迫的說不出話田柾國便走上前去。

      ⠀

      哥，要幫忙嗎？他問。沒等金泰亨開口田柾國便撇開金泰亨懸在腹部的手。他熟悉自己的敏感處，對於金泰亨的卻仍須摸索，他一邊套弄一邊抬眼看金泰亨的反應，金泰亨卻肅穆的盯著他，只能從他偶爾加重的喘息得到反饋。

      ⠀

      田柾國。金泰亨壓著喉嚨開口，田柾國抬頭，那雙銅鈴大的眼珠子印著自己不怎麼好看的臉色。那人微微隆起的臥蠶、亮的像能掉出星星的眼睛無非勾著他的心不放。

      ⠀

      哥，我清理過了。田柾國垂下頭低聲說，遲遲沒有得到回覆的他聲音開始發顫。

      我喜歡哥，哥喜歡我嗎？他不穩的音調在金泰亨心上像羽毛搔癢，每一次觸碰都讓脈搏更加激烈的貫穿全身。

      ⠀

      金泰亨沒有回話，田柾國機械的抬頭朝他笑，他一句話都說不出來。回過神田柾國已經跪在眼前，雙手伏在他的大腿內側，溫熱的觸感包裹住性器。那是他第一次不靠著色情片射精。沒控制住讓田柾國嗆得不行，他連忙彎下腰去張開手要他吐出來。他親眼看著田柾國幾乎沒有喉結的脖頸皮下滾動，爾後那人隨即張開嘴展示空蕩蕩的口腔給金泰亨看。

      ⠀

      田柾國臥倒在床上，金泰亨沒有給人自慰的經驗，何況是穴。他俯在田柾國身上，貼在他側臉旁，伸進三根手指的時候眼神緊緊盯著田柾國揚起的頭，手指才剛進去田柾國便倒抽一口氣，金泰亨連忙停下來說你不舒服的話算了，然而他正要起身便被田柾國握住肩膀，說不疼，就是不習慣。

      ⠀

      直到金泰亨提著那碩大的物甚要挺進去，田柾國才開始後悔剛才擴張做得不夠。金泰亨不停的問他疼不疼、要不要緩緩，他也只會嗚咽著說快點、他不疼，從握著肩膀變成雙手交叉著抱住，呻吟洩出他的雙唇盡數納入金泰亨的耳腔，忍著想加速的不耐一點一點把性器沒入後穴。

      ⠀

      哥，你能⋯能親親我嗎？田柾國哽住，吸了吸鼻子側頭向著金泰亨的耳廓說，金泰亨撐著身體去吻他。兩個初嘗禁果的男孩只知道唇面貼上對方的。聽說接吻要伸舌頭，田柾國笨拙的伸出小舌頂進金泰亨的唇縫，胡亂的在對方的口中舔舐直到口水從嘴角流淌下來。

      ⠀

      接吻期間金泰亨猛地挺到了底，被含住的唇堵住的聲音被悶在他的胸口，田柾國抽開嘴仰著頭喘氣，眼淚從眼角滑落，金泰亨的手到他前面套弄，刮蹭馬眼，把滲出的前列腺液反覆在頭部抹開，田柾國一時間分不清是疼的多還是爽的多。

      ⠀

      結束了笨拙的初夜，田柾國剛起床看到金泰亨在一旁看著他，他羞得把臉埋進被褥，被金泰亨連著一起抱進懷裡，翻開被褥去找那人紅的滴血的臉，親一口像親了口正沸騰的鍋。這是開始。

      ⠀

      “去那裡幹嘛？”金泰亨問。“路過。”田柾國回，群組訊息還不聽的刷新，田柾國把手機收回口袋，小心翼翼的避開地上滑溜的冰面上車返家。

      ⠀

      路上買了包菸，他和金泰亨好同一口菸，回到家才發現口袋裡還有一包金泰亨上次隨便放在他口袋的一包，想了想還是扔到了垃圾桶。

      ⠀

      金泰亨在自家陽台抽煙時，低頭望見一邊的綠植葉片上頭有個小洞，這盆栽是分居時，他從當初集體宿舍拿來的。有一次田柾國把手垂下時燙出來了個小洞。那時候金泰亨跟他說你要是再偏一點把褲子點了就完了。田柾國故作懊惱，說我才不要比你早死。

      ⠀

      有差嗎？關注一下重點好嗎？

      有差啊，要死的話我要先把現在不能做的事情都做過了再死。

      什麼事？

      快要死了再說。

      ⠀

      金泰亨聞言罵了口髒話讓他別亂講，伸手把他的菸給掐了還挨了田柾國一頓打。最後金泰亨給他分了一半的菸抽這事才算完，沒人去提兩人口袋裡半滿的菸盒，金泰亨呆呆愣著發現才抽兩口的菸快見底了，煩躁的掐到了煙灰缸裡又點了一根，他抖了抖煙灰把瀏海劃過去後腦勺。

      ⠀

      彼時田柾國偶爾被自己抓到眼神空洞的用菸頭燙自己，像燙的真的是那片葉子。而那一個個菸疤最終都被藏在刺青底下。金泰亨威脅他要是再這樣下次他也燙自己，卻沒想自己哪裡來的自信覺得這樣能威脅到田柾國，可確實挺受用的。

      ⠀

      他翻過手看向自己手腕上的菸疤，是後來一次金泰亨就著田柾國的手去燙自己手腕，手腕皮薄又近脈搏，熱量燙化他薄嫩的表皮，疼得金泰亨到現在都記憶猶新甚至幻痛。而後這份痛又蒙上一層紗布，是田柾國嚇著的表情和大罵，扯著自己去沖冷水，沖了多久田柾國就罵了他多久，金泰亨耐心的聽著，比起自殘金泰亨更願意田柾國罵他。後來他手上留下了一個淡淡的黑斑偶爾隨著血管凸起又癟下。

      ⠀

      「哭什麼呢？」

      「不要這樣。」他敞開盈滿淚液的眼楚楚可憐的說，像傷在他身上。金泰亨莫名的想暫停這一刻，田柾國哭得狼狽不堪的樣子。

      他憐惜的擦去他的淚，抱緊他快散開的靈魂。想起來已經是三四年前的事情了，不知道田柾國還記不記得──應該是記得的，他們停止那樣的關係前，床上的田柾國捧著他的手親，那人閉著眼、氣息不穩的，金泰亨一手摟著他讓他在身上坐穩，一手被田柾國抓著手腕。

      ⠀

      金泰亨起初是不明白的，以為田柾國只是暈的想抓住什麼。直到田柾國手指撇開露出他早已忘記已久的菸疤被含在田柾國唇下，落下的淚在他唇間化開混著唾液留在他手邊，金泰亨才找到田柾國在做什麼。

      ⠀

      金泰亨想說早就不疼了，後來又忘了這回事。

      ⠀

      他們最後一次性事，田柾國從一片嘔人的黑和全身的脹痛中甦醒過來，天花板是不是自己房間他卻再熟悉不過的天花板，轉過頭去看一旁的枕頭上果然空無一人，一動不動的把眼神釘在那盞符合金泰亨審美的歐式吊燈上。

      ⠀

      他腿軟得可怕，連腳趾頭蜷起都費勁，後穴酸的發疼，要是金泰亨現在出現他肯定要大罵他一頓做那麼狠是想今晚就榨乾他換個砲友嗎？他依稀記得昨晚做的快昏過去他坐在金泰亨身上搖，實在沒力了金泰亨見他慢了下來就往上頂，他哭的更狠又被翻過身操，直到昏過去金泰亨似乎也沒放過他，不過那些已經是夢裡的事情了。

      ⠀

      他斜過眼去看到房門沒有關好，開著條細細的縫，縫外能依稀聽見客廳裏男人的嘻笑聲，他又闔上眼睛卻發現毫無睡意，就是身體力竭，蹭了蹭雙腿間發現是乾爽的，想著金泰亨還算有良心。他撐著身子扯開金泰亨的衣櫃拿了件oversize的襯衫，又撿起地上的四角褲穿上走出門去。

      ⠀

      團員們齊齊看向田柾國，包括嘴正張開、手上捧著草莓吐司正要入口的金泰亨。習以為常的道了聲早，金碩珍從廚房探出身子問道：「早啊，要吃蛋嗎？」田柾國應了聲好。

      ⠀

      他坐到金泰亨身旁空著的位子，朴智旻很快幫他放了餐具在面前和烤好的吐司。他斜過去看一眼金泰亨，那人專注的盯著手機好似旁若無人，他才準備收回視線就對上金泰亨的，那人上挑著音調嗯了一聲，田柾國便不慌不忙的轉過頭去說沒什麼。

      ⠀

      “哥，”無所事事的一天結束田柾國躺在床上打開手機訊息，剛看到的還是昨天的訊息內容：

      ⠀

      “哥，可以去你房間嗎。”

      “快來。”於是他理所當然的睡在了金泰亨房間。

      ⠀

      “我有點累了。”他傳出。金泰亨看著手機許久，打出了“我知道了。”在傳出前又頓住，最終傳出“早點休息。”

      ⠀

      金泰亨知道那是什麼意思，卻又不敢於承認他們默契的讀懂了對方。

      ⠀

      田柾國說不清是什麼累了，全當是無所事事的一天無聊的倦了，但毫無來由的他就是想給金泰亨說。他摸著黑從床頭櫃拿了安眠藥一下子吞了兩顆下去，妄想著能不能馬上就睡下去。

      ⠀

      前提是，別夢到金泰亨就好。

      他偶爾夢見金泰亨在夢裡牽著自己的手，那人畫著濃濃的眼妝和眼線，眼下暈開了有點像熊貓。田柾國連在夢裡也情不自禁的想誇金泰亨好看，就算眼妝一塌糊塗也仍然不減那人的美色。那時候的金泰亨好年輕，自己已經活過了那時候金泰亨的年紀了。

      ⠀

      那個外向的哥哥喜歡拉著自己的手，出道前牽著他活動、出道後牽著他到鏡頭前依依不捨地放開。金泰亨會在鏡頭面前說玩的最好的是自己、笑吟吟地說自己真好看，要是是女孩子的話肯定是最漂亮的。

      ⠀

      金泰亨跟他說，他最喜歡自己了。田柾國會想說我才最喜歡你，哥帶我走出內向，哥知道嗎？哥給了我不一樣的人生。他說不出口的話換做羞紅的臉低下頭露出兔牙低聲的咯咯。

      ⠀

      16歲和18歲，如此剛好且詩意的年紀他們相遇了，16歲的懵懂和18歲剛成年的興奮和憧憬。而每當田柾國提起他的16歲，就是出道和在宿舍纏著他的泰亨哥。而金泰亨的18歲，是那個問他“哭了嗎？”就會潸然淚下的田柾國。而16與18歲成為他們唯一能夠說嘴的紹華。他們已經度過了一個完美的夏天，之後的一切都是鏡花水月。漣漪吹不散、出手撈不起，每年花謝多麼落英繽紛，跟那一年比起來都矯揉造作。

      ⠀

      身在迷途上的茫茫暗夜中有一副低沉的嗓音一直喚他，那副溫柔、熟悉、黏膩的嗓音包裹著他成為他黑暗中的安全感來源，直到光來臨的那一刻先照亮他們相握的脈搏，熠熠落在金泰亨的臉上，不去看金泰亨等於閉上眼睛，他的世界又會歸於寂靜。田柾國長大了，金泰亨心裡永遠存在一個用亮晶晶的雙眼看著自己的田柾國。

      ⠀

      他不需要夢境一再提醒他們有過的過去，好像一再加深他心口那塊屬於金泰亨的疙瘩，惹得人煩。有時候田柾國想起金泰亨看著自己的眼睛，試圖從中脫離那濃稠的、掛在他身上那脫也脫不掉的，他看得累了轉過頭，再轉回去，發現那個眼神已經不一樣了。

      ⠀

      好多年前金泰亨進了劇組，認識的演員哥哥。而沒日沒夜繁忙拍攝和抽空才得以到場的練舞幾乎填滿了他的生活，回了宿舍沾了床就睡，睜眼是清晨灰藍色的天，總在成員們都還沒起床的時候獨自前往片場。

      ⠀

      他和朴智旻在練習室為了吃餃子吵架，氣得奪門而出，來不及回頭看哪怕一眼，他坐在附近公園盪鞦韆上想起關門的那瞬間，田柾國朝朴智旻走過去。

      ⠀

      他踢開了地上的石子，喀啦喀啦的滾到石板路上。他低下頭去，水滴滴落到沙坑裡被細碎的灰塵給包裹成圓潤的球狀，小球越來越多，圓的圓，有些變成一潭小水窪，他像懸在空中垂死著滴血。

      ⠀

      他甚至沒有察覺到朴智旻在他一旁的鞦韆上坐了許久，直到他抬頭，朴智旻淡然的臉色在水霧中掀起波紋，小水窪在他臉上流成瀑布。智旻啊，我好累，我不知道怎麼辦了。他說。

      ⠀

      我好累啊，公司要我少露面，要我別想那麼多，他們是什麼意思？還有你，為什麼你也要這麼對我，為什麼你們都要這麼對我，為什麼總讓我一個人。金泰亨臉發燙，淚流過的地方灼熱的燒著，直到他睜不開眼幾乎快睡著。

      ⠀

      朴智旻和他說了很多話，他只記得對不起。他抱了朴智旻很久很久，也說對不起。實際上他不清楚他做錯了什麼，他仍然不明白，他只是怕哪怕慢了一秒朴智旻就不抱著他了。

      ⠀

      還有你，為什麼你不來找我呢？為什麼？

      ⠀

      朴智旻從練習室離開過後田柾國跟著其他成員回了宿舍，躺在床上難以入睡，感官全數聚焦在門外的動靜。金泰亨臨走前踢開的空水瓶正中他的額頭，提醒著金泰亨究竟揣著多烈的怒火衝出去，他看著朴智旻低下頭去臉色晦暗不明，再去追金泰亨留下的餘韻。

      ⠀

      拍戲就那麼重要嗎？哥，他們就那麼重要嗎？金泰亨踢開的空瓶被他偷偷撿了回來，扔在床頭閉著眼不去看。金泰亨不常出現在宿舍，出現的時候說的也是和演員哥哥們吃了什麼玩了什麼，鄭號錫會在一旁附和著真有趣、金南俊一臉欣慰地看著他，唯獨田柾國看著手機不知道該如何加入這個話題。

      ⠀

      他說不出他也想玩這種話、更說不出聽起來很無聊，他偶爾偷偷抬眼看向金泰亨發亮的眼神說著沒有他的故事，咬著下唇回了房間。

      ⠀

      他幾乎快進入夢鄉時聽見外頭有動靜，大概是朴智旻和金泰亨回來了，腳步聲逼近門口時他下意識屏住呼吸，直到那個腳步聲走遠。隔天朴智旻和金泰亨一如往常的坐在餐桌上吃飯，金泰亨抬眼看到他倏地又離開。

      ⠀

      晚上金泰亨把他堵在房間，他勉強才能看見金泰亨解開襯衫扣子時的垂下的眼神，靜默的、疏離的、他不喜歡的，明明不是看著自己，他卻恐懼金泰亨要是抬頭他肯定會猛地大哭。哥，別那樣看我。他心想。

      ⠀

      如果成長痛之一是我們不再契合，那我該如何面對痛苦掘出的光明和逐漸遠離的你？金泰亨像長在他眉心的肌肉，隨著生長脹痛和壓迫他的雙眼，卻是他讓他得以看清世界。田柾國束手無策，只有金泰亨吻他的時候他得以從那將他撕裂的痛苦中尋得一點結痂後的麻痺。

      ⠀

      幾年後結痂後的疤被刺青給覆蓋，眾人撲天的謾罵又將他的疤撕裂，再添上新的刺青，一再循環著讓他的皮膚越來越薄，心越來越靠外而敏感。他抽菸的時候短暫的在尼古丁中讓自己死一回、有時候一天晚上死好幾回。

      ⠀

      還有酒精和霓虹燈，田柾國曾經想著能死在裡頭。睜開眼時紅色的、閉上眼是黑色的、再睜開眼是藍色的，每一次眨眼都像一次重生，可菸越來越短，刺青越來越多，提醒著他他還在同一個時空裡。翻開社交軟件裡頭掛著他標籤的謾罵，提醒他還是田柾國。

      ⠀

      他滿身酒氣回到宿舍，看到金泰亨陰沉著臉坐在沙發上看到他臉色更糟，田柾國管不了那麼多逕直朝著房間走去，暗暗期待的事情發生，於是他被堵在狹窄的玄關。田柾國瞇著眼看他。

      ⠀

      去哪了？金泰亨低聲問。

      跟你沒關係。田柾國回道。

      什麼叫沒關係？你要我們全部毀掉嗎？金泰亨氣沖沖的握著他的手腕，他彼時比金泰亨壯一些，輕易就能甩開，卻任由金泰亨把他手腕抓的生疼。

      ⠀

      我會拿捏輕重，我很累，可以放開嗎？田柾國不耐煩的睜開眼睛，眼前模糊一片只有金泰亨分明的眉宇和慍怒的神情，金泰亨氣不打一處來，甩開他的手進了房間，砰的一聲。

      ⠀

      「打算和誰一起做治愈的事情呢？」

      「治愈的事情一個人也可以做。」金泰亨說。

      「不跟我們一起嗎？」田柾國的聲音在七個人的嘈雜聲中那麼小，金泰亨卻看著他，好像聽到了卻無言以對，田柾國轉過頭去，想著這是金泰亨。而那個在鏡頭面前戴著他為掩蔽刺青的另一隻手套的也是金泰亨。

      ⠀

      我懷念那時候的你。金泰亨生日時跟田柾國說。田柾國呆愣愣的盯著金泰亨的鞋，點了點頭。哪時候？出道前？剛出道？田柾國想，大概是他還沒開始刺青的時候。

      ⠀

      金泰亨在田柾國被自己堵在玄關時低頭看他，疲憊的雙眼和癟下去的臥蠶，他的眼底再也藏不住任何事，垂落的睫毛將他的心事從眼瞼掃落，他卻拾不起也讀不明。

      ⠀

      田柾國垂眸的樣子也格外美麗，或者淒美。田柾國依然粉身碎骨的跳舞唱歌，甚至落下腰疼的毛病也只是一個人吞著。

      ⠀

      金泰亨皺眉，好像懂他的心事，卻離自己十分遙遠，那只是田柾國的心事，只是他的，與金泰亨毫無關係。那已然不能稱為少男心事，更多的是惆悵和緬懷的顫動回音，非常淡的、非常冗長的，像掐著他脖子卻仍然給他留一口氣。

      ⠀

      他們太遠了，對望都隔著一根菸的距離，而他們不再能明白對方吐出的煙霧究竟是為了麻痺什麼。抽完一根煙要五分鐘，他們卻連半根煙的時間也無法有話說。金泰亨手腕上的菸疤又開始隱隱作痛。

      ⠀

      田柾國回到房間，頭抵著門跪落在地上，身體密密麻麻的疼，酒精帶來的混沌和沉重讓他無法起身癱軟在地面上，淚液從眼頭滑落山根流入另一隻眼睛。

      ⠀

      哥，我好痛啊。

      能不能再看看我，我會愛你的，用你的方式。

      ⠀

      他躺在地上沉沉的睡去，直到清晨的熹微灑落，他躲在床的陰影下照不到一絲光亮。睡夢中他好像被抬起，重重的摔落在床裹上厚重的棉被，睜不開眼，也不想睜開眼。

      ⠀

      他夢見自己回到13年的夏天，他怯生生的走到躺臥在窗邊的金泰亨身邊，不敢喊他。金泰亨佯裝惺忪睡眼轉頭看他，喚他：「小國，午安啊。」

      ⠀

      「哥⋯睡在這裡不熱嗎？太陽好大。」

      「很舒服呢，小國要不要躺過來。」

      ⠀

      於是田柾國扭捏的躺在金泰亨旁邊，些許拘謹在金泰亨眼裡卻是極大的進步，總不是轉頭後看見弟弟裝作路過，後來他們都睡著了，陽光照得他們全身發燙，闔上的雙眼尤其溫熱，金泰亨習慣性的轉過身手腳並用的抱住他。

      ⠀

      夏天多熱啊，但他還是想回去。回去看他被熱浪溶解的少年稚氣，拖拖拉拉的流淌著血汗淚。太陽不懂落葉的言不由衷，儘管風吹過落葉是也揚起它的心事，太陽還是會離開這個夏天。可惜這個世界太大，雷同也數以萬計，他的青春志氣再也撐不起他富足的一切，何止是年華，還有他身上曾流淌著的年少輕狂。

      ⠀

      他醒來後房間空無一人，晌午的陽光照不進房間使他感到一絲涼意，他看著完完整整包裹著他的被褥，才確定了不是夢。現在也不是夢。

      ⠀

      田柾國才想起金泰亨曾經對他說：會有很多你無法原諒的人出現，二十歲之後，也包括我，是吧？

      ⠀

      也包括哥嗎？但我不想哥對不起我。田柾國想，金泰亨沒有對不起他，怎麼會對不起他？但他好疼，菸疤疼、刺青疼、看見金泰亨疼、看不見金泰亨也疼。

      ⠀

      夢裡見是他們最該保持的距離，而不是抬眼垂眼都離不開他的雙眼和鞋尖。

      ⠀

      至少金泰亨是這麼認為的。直到分居過後低頭看到那盆盆栽，想到他故意放在田柾國口袋中的菸。他竟固執的以為他們的痛苦只是因為無法完全斷開的不明不白。

      ⠀

      為什麼我不再了解你了？金泰亨無數次的想著，他不再是那個能夠帶田柾國走向陽光的人，他不再明白田柾國的痛苦，像當初的田柾國甚至不知道他在鞦韆上流的淚淹沒了他們之間的一條路。

      ⠀

      你不會原諒我的，小國。他盯著時年十六歲的田柾國心裡暗暗躁動，那雙小手被自己握在手中，偌大的眼睛和未經世事的笑，田柾國像一本為他量身訂製的畫布，等他、給他上色，他若不出手那將是永遠的黑白色。金泰亨才明白連相愛都是他一手造成的，他罄竹難書，只是直到田柾國成年後出現在自己的房間使他更確定──我們都無法原諒對方的。

      ⠀

      田柾國家的門鈴突然響起，他疑惑的看向監視器畫面怔愣，然而身體搶先一步的按了開門，金泰亨在門外已經脫好了鞋，一進門便出手把田柾國摟向自己，撲面而來的是田柾國許久未聞見屬於金泰亨的香味和濕吻。

      ⠀

      金泰亨的手捏著田柾國的手臂，確認沒有任何一塊新的紗布才安心的去摟住他。田柾國被抱得繃緊身體直到被推倒在沙發上，金泰亨小心翼翼地抬起他的腰，吻到他頸側的時候匆忙而自然的提醒：腰疼跟我說。

      ⠀

      金泰亨聞見田柾國悶哼著點頭，由著他落下細碎的吻在田柾國裸露出的皮膚上。忽然猛地被掐著脖子推開，田柾國惡狠狠地盯著他，還沒等金泰亨開口他便質問：「你跟誰做過？」

      ⠀

      「什麼──」「為什麼突然關心我的腰？你在關心誰？」田柾國又問。金泰亨被突然這麼問的杵在半空中喉嚨間哽不出一句話。被田柾國當作默認，雙手並用就要推開他壓在自己身上的身體，此時的金泰亨卻已經不是自己能夠要推開就能輕而易舉的身材。

      ⠀

      「我沒有和別人做過！」金泰亨情急之下吼道。「那你莫名其妙關心我的腰幹嘛？」田柾國不甘示弱的回嘴，儘管眼眶的紅染得他雙頰嫣粉也絲毫不影響他氣勢洶洶的回問。

      ⠀

      田柾國喘著大氣手還推搡著要離開，之間聞見金泰亨壓抑著說道：「你不是腰受傷了嗎？」聞言一切彷彿嘎然而止，田柾國不可置信的顰眉，「你怎麼知道？」

      ⠀

      「我為什麼不知道？」田柾國被問得啞口無言，他在那一刻想到了很多人，就是沒想到自己也有腰疼的毛病，甚至因為習慣已經不被當作毛病。金泰亨見他不再反抗又欺身吻上去，洶湧而急促的，果然並沒有再次被推開。

      ⠀

      我們不要作愛人，不要任何有始有終的關係。

      我要與你的快樂有關，再成為你的痛苦，我要將我縫在你眉間，同你一顰一笑、同你淚流，同你見任何人都擁有我的陰影。

      ⠀

      田柾國覺得耳朵搔癢，睡眼惺忪的撓了撓頭將頭從被褥中探出，還未反應過來，金泰亨裸露且佈滿抓痕的背脊印入眼簾，那人些許黝黑的膚色背著光更黯淡，田柾國鬼使神差的伸出手刮蹭他凸出的肌肉上被抓出的倒刺。他些許駝背，聞見被褥的沙沙聲稍微側頭卻不足以讓田柾國看清他的側臉，倏地又轉回去。

      ⠀

      「我們，」金泰亨開口，田柾國面無表情地洩了力躺回原位，望著白花花的天花板裝著一個圓的、白的、毫無特色的燈，無聲的嘆了口氣。

      ⠀


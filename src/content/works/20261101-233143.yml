title: 相愛的迷思
updated: 2026-11-01
summary: 或者不太相愛
status: finished
chapters:
  - body: |-
      

      ⠀

      金泰亨想，大概是不愛的。那太好了。

      ⠀

      「哥⋯為什麼又來了。」田柾國看著躺在自己床上的金泰亨發出疑問，那人理所當然的霸佔了整個床鋪，田柾國要睡也逼不得已得躺在他的手臂上，金泰亨笑著撇過頭沒理會他，田柾國摸摸鼻子移開了金泰亨展開的手臂躺了床鋪的左半邊。

      ⠀

      金泰亨順勢雙手環抱住了側躺著的田柾國，隨著腳抬起又跨到了田柾國的身上，那人也習以為常的在他的臂彎裡找好舒服的位子，背對著金泰亨打開手機。

      ⠀

      相愛是兩個人的事情，那只有一個人的話，就不算數了！

      ⠀

      金泰亨貼著田柾國的背，一下一下撫摸那人的髮絲，又越過田柾國的肩頭去看那人手機裡的內容，視線落到那人白皙的後頸，金泰亨鬼使神差的將身子向下挪動，帶著溫熱氣息的雙唇貼上那人露出的一小塊後頸，又撇過頭。

      ⠀

      金泰亨感覺那人身體一震，又迅速恢復正常，他被逗笑在那人背後咯咯的響，那人卻一句話也沒指責自己。金泰亨的呼吸平緩，田柾國的房間只開了一盞暖黃色的落地燈，他瞇起眼睛睡意就迅速湧上，迷糊間聞見懷裡人開口：「哥要睡了嗎？我去關燈。」

      ⠀

      「不用，」金泰亨應，「這樣就好。」又將雙臂摟得更緊，那人聞言也就縮回了他的臂彎。不過睡夢中金泰亨還是發覺那盞燈關了，金泰亨眼裡田柾國一直都是這麼細心的孩子，難怪哥哥們都寵他。懷裡的人不知道什麼時候氣息變得和緩。金泰亨夜裡醒來的時候，田柾國的眼睫煽動一陣難以察覺的風，呼呼的吹在金泰亨的臉上。

      ⠀

      「喂？」「哥，我在公車站。」「你這小子，等著啊。」金泰亨躺在床上接到田柾國的電話坐起身來，不太意外的罵了一口，起身穿上上衣，踏出門口感受到潮濕包裹住周身，又轉頭拿了一把傘。

      ⠀

      「路癡。」金泰亨走到公車站牌下，看到孤零零的倚靠在站牌上的田柾國，那人見到他只是習以為常的招了招手，絲毫沒有大半夜大哥哥叫起床的愧疚。「你不睡覺我不用睡啊？」

      ⠀

      哥沒有那麼早睡，我又還沒回家。田柾國暗想，始終沒有說出口。

      ⠀

      起初田柾國還小的時候，在公司練習晚了公車末班車也過了，他又不認路，實在沒辦法的他只能打給最熟悉──也跟他一樣蠢，不會認真念他這個年紀了還不認路的哥哥，金泰亨就時常半夜接到田柾國的電話，要自己去公車站接他。起初他們都沒什麼錢，坐計程車與他們而言是筆不小的金額，尤其這件事情又不罕見，還是那雙腿最省錢。金泰亨倒也只是嘴上念叨個幾句，實際上田柾國後來甚至不用開口說明白金泰亨就會出發。

      ⠀

      「下雨了，進來。」金泰亨沒有感覺錯，果然飄起的毛毛雨，田柾國身板小很容易被金泰亨的手臂圈進不大的傘下。金泰亨握著少年的田柾國的肩頭，兩個人窘迫的擠在一塊，「哥別淋溼了。」「不用你心疼，我身體好得很，你年紀輕輕就怕冷別感冒了。」他故作兄長的語氣提點他，田柾國也就乖乖閉嘴了，手卻默默覆上金泰亨拿著傘的手，把傘往金泰亨那兒挪。金泰亨覺得田柾國太懂事了。

      ⠀

      「心疼我的話認認路吧，大半夜的。」金泰亨越說越小聲，田柾國沒應，金泰亨也全當田柾國沒聽清了，這大概是搬離小宿舍前田柾國都還沒學會從公車站牌走回宿舍的原因。而直到他們都有錢了，好似是省習慣了，他們也沒養成坐計程車的習慣，金泰亨還是這麼習以為常的被大半夜叫出去，陪著田柾國走這段漫長的夜路。

      ⠀

      回到宿舍後兩個人都躡手躡腳的深怕出聲吵到其他哥哥，田柾國打開房門下意識回頭看金泰亨，那人則還坐在玄關收傘。田柾國覺著有些不好意思又走上前去，金泰亨聞見逼近的腳步聲回頭用氣音讓他快點回房間休息，順勢用手指了指，。柾國呆愣在原地，金泰亨見狀沒再開口，慢條斯理的收好傘，走到田柾國跟前一把把人抱在懷裡。

      ⠀

      「哥怎麼⋯總抱我。」他們耳畔相貼，田柾國用氣音金泰亨就能聽得一清二楚，那人聞言蹭了蹭。金泰亨記不得田柾國什麼時候開始在意自己為什麼總抱他，從前的田柾國被自己樓上只會乖巧的回抱，好像是最近開始，總會發出這樣的疑問。

      ⠀

      是好奇嗎？覺得這樣很奇怪吧？金泰亨想著，卻還是把人抱的緊緊的，逐漸也能感受到懷裡的人逐漸結實的身軀──不是孩子了，他們都不是孩子了。

      ⠀

      金泰亨覺得田柾國越來越懂事了，甚至比自己更甚。會心疼哥哥、照顧哥哥，從前那個要被照顧的田柾國在好遙遠的過去，被金泰亨好好的記著。金泰亨大田柾國兩歲，只是兩歲讓金泰亨感覺多偷了兩年的時間領先田柾國一些日子比他成熟，殊不知兩個人只是幼稚的一起挨訓。他怕自己有那個能力當哥哥的時候，田柾國已經不需要照顧了，每每接到田柾國的電話總覺得自己偷來的那兩年還算賺到。

      ⠀

      可金泰亨還是覺得，田柾國還是不怎麼會拒絕人，才會這麼乖巧的被抱在懷裡。不然呢？他沒想下去。他們抱到牆上高掛的時鐘久得也像催促、抱得金泰亨感覺天田柾國的呼吸都有些紊亂。

      ⠀

      「去睡吧。」金泰亨放開他，揉了揉他的頭頂，兩人一前一後的走向他們相鄰的房門，田柾國站在門口回頭看了一眼金泰亨，金泰亨朝他招招手說晚安，田柾國點點頭。而田柾國佇立在兩人相隔的那堵牆邊，聽見金泰亨的房門喀嚓的一聲關上，才轉身闔上房門。

      ⠀

      什麼都不說的話，就是他自己的事情了。

      什麼都沒說的話，就是他自己的事情了。

      ⠀

      金泰亨摸著那堵牆，感受些許因為房裡的人腳步而輕微的震動，等到完全停止，他收回手。想著想著換下那間被淋濕的肩膀的衣服，窩在一個人的雙人床上睡下了。

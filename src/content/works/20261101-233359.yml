title: Gray
cp:
  - 泰正
updated: 2026-11-01
summary: 忘記也沒關係，他們沒有人好奇那部電影的結局，重來一次他們也不會看。重來一次也許田柾國會更投入的望著金泰亨的眼睛，甚至記得他呼吸的頻率，他們還是會相擁著進入不同的夢境。他們至少有過那一天，就算結局永遠是今天。
status: finished
chapters:
  - body: |-
      一些作者對泰正的想法延伸產物，ooc預警


      田柾國突然覺得有些頭疼，半夜從夢中醒來時發現被窩裡蓄著散不掉的熱氣，摸了摸額頭才發現自己在發燒。舔著乾澀的嘴唇去廚房接水，還發現喉嚨疼得不行，第一個想法是幸好現在是休息期不會影響到演出。扶著額頭從抽屜找藥，囫圇吞了幾顆又躺回床上。

      ⠀

      攪散的睡意讓他不得不在床上保持清醒，抹黑拿起手機發現是凌晨4點，再熬熬就能看到日出了。再往下看發現金泰亨在群組分享短影片，一看是3點發的。點開發現就是個很無聊的搞笑影片，在圖庫裡翻了一個可愛但沒意義的動物圖按了發送。

      ⠀

      田柾國數著，下一秒果不其然收到了金泰亨的私訊：“還沒睡？醒了？”“好像感冒了。”“呀，身體怎麼還這麼差，有藥嗎？”“嗯，現在好像可以看到日出。”“大城市的看得到什麼日出～”配上一個可愛的小狗表情包。

      ⠀

      果然，還是一樣無趣。田柾國丟開手機，摸著拿起遙控器把自動窗簾打開。這時候的首爾還是黑漆漆一片的，他忍著不適把自己包進深色的被褥裡，想著能睡就睡、不能睡那算了。

      ⠀

      田柾國忽然感覺肌肉一陣酸痛，頓時感覺不妙，感覺不是什麼小感冒，這時手機震動起來他也沒力氣起身去拿，吃力的抬起手錶看到金泰亨又傳來訊息：“真的還好嗎？”他想拿手機回覆，卻沒想好回覆好還是不好，迷迷糊糊的居然就睡著了。

      ⠀

      睜開眼發現8點了，身上的不適感除了燒因為退燒藥退了一點其他卻沒有絲毫緩解，睡過覺勉強讓他能站起身來給自己倒水洗漱，準備去看看醫生。出門前拿起手機外看到金泰亨傳了一張太陽剛升起而昏黃的天空，配文“日出。”田柾國哼笑一聲又把手機收回口袋。

      ⠀

      不過他想起他們兩個還真的一起去看過日出，也是像今天這樣子失眠的人莫名達成了邪惡的共識。當時還是宿舍生活，躡手躡腳的穿著睡衣在路邊叫了台計程車載他們去山上。第一台拒絕了他們，到了第二台他們約定給司機兩份車費才被答應。

      ⠀

      田柾國想，那時候的他們可是真的不怕死的。正值回歸期，老早就有練習的行程，他們愣是在山上待到了十點多，離表定練舞的七點遲了不少。他們一雙人影走進練習室的時候鄭號錫發黑的臉色狠狠鎖著他倆，倆人聲都不敢吭趕緊站到自己的位子。要不是他倆學得快否則肯定得挨一頓罵。

      ⠀

      他們在便利商店隨便買了早餐，飯捲、香蕉牛奶、草莓牛奶，田柾國後知後覺那個飯捲肯定是讓他整天水腫的罪魁禍首，他和金泰亨各吃一個還綽綽有餘。

      ⠀

      其實他們沒有看到所謂日出，頂多稱得上太陽上升，霧濃的像那顆火辣辣的球是從水裡撈出來的，還散著熱氣，不過他們也無妨。對他們來說上癮的只是這種脫離掌控的刺激，日出於他們而言沒什麼特別的。他們要是在十二點起來，他們搞不好會去十公里外的公園盪鞦韆。

      ⠀

      診斷出是流感後田柾國拿著藥準備回家繼續躺著養病，赫然想起昨天金泰亨問他的問題他還沒回覆。打開手機從日出的照片往上滑，卻發現剩下那句“大城市的看得到什麼日出～”，他想了想，昨晚大概是燒壞了。

      ⠀

      也不只一次覺得自己大概是眼花了看錯訊息，金泰亨本來就愛傳些離譜的東西給他，吃完的餐具、路邊的小狗正在灑尿、飛機上沒有被收走的耳塞⋯⋯看起來像金泰亨夢遊時拍的，卻又不那麼隨意；更像隨手的分享，卻不夠正經。奇怪的是田柾國總會看完，金泰亨也不會收回。

      ⠀

      於是田柾國傳了一張他在開車的照片，對面沒有馬上回覆，田柾國猜到金泰亨大概是熬到了日出才睡覺，盯著手機的未讀標示發愣，估算著大概是一個半小時前金泰亨才睡，眼下該是要睡到下午了。直到紅燈亮起他才把手機丟到一旁。

      ⠀

      然而金泰亨沒有如他所料的睡到下午，中午收到回覆“那麼早去哪了？”“看醫生。”“怎麼了”“流感。”對面顯示輸入中許久，最終跳出的一句：“照顧好自己，這段時間別喝酒，傷嗓子。”田柾國扶了扶沉重的腦袋，在手機面前嗯了聲就當作回覆了。

      ⠀

      “哥有睡嗎？”“有，等等跟朋友出去。”田柾國又再次意念回覆了個嗯，手機就被扔到一旁去了。

      ⠀

      他覺得身上酸脹的慌，反反覆覆翻來覆去也沒有任何緩解。他特意擺了兩個水壺在床頭好讓他不用一直到廚房拿水，昏昏沉沉的就想些以前的事試圖讓自己再次陷入夢中。

      ⠀

      以前生病的時候都怎麼樣？在宿舍的時候他會把自己關在房間裡，免得全員因為疾病拖累了活動。為了自己和大家他會這麼做。而金泰亨常常是那個來房間給他送飯和藥的人。

      ⠀

      金泰亨會悄悄打開門，捧著盤子放到床頭，田柾國若躲在被窩裡他會輕輕撩開去摸那人發燙的額頭，輕聲說吃飯了、吃飯才能吃藥。就算田柾國一口都吃不下，被金泰亨這麼哄著也會勉強坐起身小啜幾口乏味的粥，再在金泰亨的監視下吞了藥。

      ⠀

      後來田柾國不用金泰亨盯著他也會把藥給吃完，分居後的家裡也備滿了各式各樣的感冒藥。只是直到真正分居，金泰亨還是會盯著田柾國吃藥，就算田柾國只是想賴床一下也會被金泰亨當成逃避，半拉扯著人坐起來。不過田柾國不怎麼在意自己在這位甚至比自己還幼稚的哥哥面前是一個還不懂事的孩子，會乖乖的就著金泰亨給他倒的溫水吃藥。

      ⠀

      朋友？田柾國忽然想起金泰亨剛剛說他要跟朋友出去，哪個朋友？他下意識的好奇，像突然發現水面下有一枚剛剛被漣漪給模糊的硬幣，下意識想伸手，卻發現自己也不是很缺那一個硬幣，看著漣漪逐漸被淡化，那枚硬幣閃著光芒在他眼前像給他眨眼睛，他卻不想為了撿它而濕了手。

      ⠀

      他應該在在意嗎？也許應該在意一下，像金南俊之前也總愛問他們不見的時候去了哪，出於好奇和關心。後來金南俊誠實的說，也是怕自己年輕不成熟交朋友沒輕沒重的，田柾國不置可否。他的哥哥們沒有害過他，從來他一直根深蒂固的認為他像是被六顆種子一同生長出來的植物，有著六種以上不一的特徵。而他有時候覺得自己像金泰亨多一點。

      ⠀

      金泰亨參與他的成長興許不只是「種子」那麼簡單，更像陽光，甚至身上還有著那神似金泰亨的突變。金泰亨的外向讓剛出道的他理所當然的依賴上這個迅速對他敞開心房的哥哥。金泰亨帶他玩、帶他逃練習、帶他吃好吃的，甚至在自己洗澡的時候衝進來說一起啊，把田柾國嚇得一天沒睡好覺。

      ⠀

      有時候還會在自己面前懟其他哥哥們，而當他看見其他哥哥們看到金泰亨這麼以下犯上居然是笑著的，其實有那麼一段時間感到嫉妒，嫉妒金泰亨毫不掩飾的外向和招人喜歡的特質。自己真正像太陽花一樣向著哥哥綻放生長，卻偶爾羨慕那樣的光芒不屬於自己，只能讓他神似太陽的外貌閃閃發光卻仍然不是太陽。但太陽花沒了太陽是會萎凋的。

      ⠀

      田柾國卻覺得金泰亨是灰色的，他喜歡黑色、喜歡白色，灰色則適合藏在心裡，被人想起，不適合穿在身上供人觀賞，否則總讓他覺得不夠黑、不夠白，反正不上不下的。灰有很多種灰，黑和白卻很分明，金泰亨在他心裡並不那麼分明，各種意義上的。

      ⠀

      他有時候覺得金泰亨像朋友、像隊員，很偶爾的才會覺得他像一個哥哥，金泰亨甚至比田柾國還孩子氣，大自己兩歲卻和小兩歲的自己偏好同一種幼稚的玩味，這大概是他倆總玩得好的原因的。

      ⠀

      大部分時候，像朋友，像很好的朋友。他們靠在一起打電動的時候隨著電視裡的角色一起晃動，不知不覺靠在一起。田柾國不喜歡別人的皮膚觸碰到他的感覺，他人的體溫在他身上殘留成一塊沒有傷口的燙傷讓他不斷回想起，可唯獨金泰亨碰他的時候溫度適中，像在他身上敷了層恆溫的熱毛巾，粗糙的質感完美貼合他的皮膚紋理。

      ⠀

      田柾國每每不知金泰亨有意還是無意，從揉捏變撫摸這麼來回，若他是個可塑的玩偶，肯定全身上下佈滿金泰亨隨意捏塑的斑駁紋理。反正他後來總會發現除了被摸過的地方，他的耳朵和臉頰都會浮起嫣紅，像天然抹在他臉上的花瓣色素化開一片，金泰亨時常誇他漂亮。漂亮？田柾國當時惱怒地想怎麼會說他漂亮？年輕氣盛的少年比起漂亮這種陰柔的詞彙更愛被誇帥氣，可金泰亨卻很少這麼誇他。直到後來的很久，他也下意識的會問別人自己這樣漂亮嗎？金泰亨會說，很漂亮。

      ⠀

      是哪種漂亮？是女孩子的那種、風景的那種、還是做得好的那種？像英文語意裡的beautiful 總能表達很多語意。他撇過頭，紅的滴血的耳朵卻出賣了他。他後來覺得，他們互相都喜歡這麼晦暗不明的對對方說話，一層意思底下還能有一層意思。

      ⠀

      像他們稱對方朋友的，至少田柾國活到現在覺得朋友分很多種。他分不清金泰亨是哪種，但大概是很好、好到希望對方屬於自己的那種。

      ⠀

      過去突然某個時期，金泰亨和演員的哥哥們玩得好，好到田柾國甚至不再能夠常常在宿舍裡找到他。他落寞的同時又覺得這又有什麼，他也有自己的朋友，只不過他也不會想特別去社交罷了。

      ⠀

      金泰亨話越來越少，跟其他成員包括和自己，他很疑惑也很好奇金泰亨怎麼回事，卻只是在越來越難得的獨處時間發現金泰亨總是盯著自己看。田柾國覺得那是一種他揣摩不來的眼神，不是疑惑、更不是挑釁。田柾國有些彆扭的想說他的眼神有些深情，他卻分不清那個情究竟是什麼。直到田柾國的餘光瞥見金泰亨轉過頭去回到電視上，田柾國才鬆了口氣。

      ⠀

      哥為什麼這麼看著我，又一邊冷落我？他矯情的想問，卻覺得自己一個大男人，嬌滴滴的問這種問題幹什麼，但這個問題分明也沒有任何偏頗，他只是覺得這很不公平，為什麼金泰亨可以這麼對他。

      ⠀

      怎麼對他，田柾國把手掩住眼睛，擋住天花板上那小小的燈點，金泰亨也沒怎麼對他。朋友之間各取所需，田柾國小時候孤單內向不知道該如何與人相處，金泰亨理所當然的執起他的手把他推到大家的面前教他一句一句話說，直到他學會了如何與人相處，才光榮的退場。這很合理，田柾國想著，可剛學會走路的孩子總會回頭看爸爸媽媽，沒看到了就哭，田柾國覺得此刻他像回頭看不見父母的孩子，可他終究得學會自己走路。而他給金泰亨的回報就是他從來不拒絕金泰亨對他的要求和親密。

      ⠀

      「哥，我覺得很奇怪。」田柾國開口，金泰亨回頭看向他，眼神裡沒有不解，只是等待著田柾國接下去，田柾國猶豫著選了一句最不鹹不淡的問題：「最近還好嗎？」他問。他用盡他一生的人類資料庫想出一個人失常的時候，該以什麼樣的方式關心，然而他煩惱了很久，因為它似乎從來沒有過這樣的經驗，從來沒有過因為一個人的失常而產生好奇。

      ⠀

      「沒什麼。」金泰亨把嘴巴悶在手臂中，聲音在他的手臂肌肉中化開，「有點累。」爾後他垂下本就睜得不開的眼睫，田柾國想著自己是不是沒有問對問題，然而他已經用盡力氣去想和鼓起勇氣去問了。

      ⠀

      良久金泰亨只是更靠近他，他們雙肩靠攏，感到金泰亨側過頭鼻息撲在他的鎖骨處，那樣的氣息像極了金泰亨的手指在他身上捏著撫著，卻更快的讓他的皮膚紅透，而電視機裡五彩繽紛的霓虹讓他的皮膚透著不一樣的色彩，發熱而紅的皮膚才沒有如此清晰可見。

      ⠀

      「柾國兒，」

      「嗯？」田柾國緊繃身子，他全身都是低溫空調的冷，唯獨鎖骨那塊清晰的溫熱。金泰亨明明已經坐正，那溫熱卻真切的烙在他身上，像他討厭的燙傷。

      ⠀

      金泰亨直勾勾地看著他，用那雙“深情”的眼睛。金泰亨靠他很近很近，他們總抱在一塊睡覺他也未曾感受到金泰亨的距離與他如此接近。他矛盾的覺得這樣太近了，但也許能在更近一些呢？像金泰亨杵在灰色的那塊地，看不清該前進還是後退。

      ⠀

      最終是田柾國撇過頭，他受不了這樣的對視，電影早就因為長時間的分心而演到了他看不懂的階段，他仍需要佯裝沉浸其中才能讓金泰亨覺得他只是沉迷電影，他卻感覺到胸口的臟器猛烈的跳動。

      ⠀

      然後，沒有然後，金泰亨睡著了，他也是。醒來時他們疊在一起，像過去的每一次他們一起睡覺。田柾國卻知道這不一樣，這明明不一樣的，泰亨哥，這明明不一樣。

      ⠀

      不一樣，但田柾國覺得他沒有資格問，是他先撇開視線的，後來他煩惱了很久，是不是因為他。可他又安慰自己，那為什麼金泰亨又不說話？

      ⠀

      後來金泰亨突然開始在出門前跟他說，偶爾是他在房間打遊戲的時候、偶爾是他在沙發上他在睡覺的時候金泰亨會傳簡訊，照片、語音，各式各樣與他分享他的去處的，還有身邊的朋友，到後來田柾國甚至認識了他們。

      ⠀

      金南俊某次偶然問起金泰亨的去處，金泰亨頻繁消失宿舍漸漸的成為常態，這樣的詢問從來也只是走個過場，直到有一天田柾國回答的鉅細靡遺，還未察覺金南俊不解地問你怎麼知道，田柾國就自然而然的說金泰亨和他說的啊。

      ⠀

      他們都一直以為會一直這樣下去，直到他們結束宿舍生活。搬離了宿舍物理距離被拉大，連同那些虛的一起被距離稀釋。金泰亨還是跟他報備些有的沒的，也還是偶爾不請自來。田柾國的別墅與他們的宿舍沒兩樣，他們還是靠著玩遊戲、被金泰亨摟著睡覺。

      ⠀

      有時候田柾國半夢半醒間，發現金泰亨偷偷抽走手臂，關電視、收拾桌面，他想開口說他們起床了可以一起收，可實在一點力氣都沒有。直到金泰亨收拾完畢，他感受到頭頂上方的沙發輕微下陷，自己的頭被小心翼翼的捧起落在被柔軟的腿肉包裹著的大腿骨上。其實不是特別舒服，但金泰亨的動作讓他做著最熟悉的裝睡，那人的指尖撫過他的側臉，像燙傷。

      ⠀

      他察覺金泰亨嘆了口氣。然後金泰亨換了個姿勢手腳並用的把他緊箍在懷裡，像過去的每一次。可田柾國想說，這不一樣的，泰亨哥，這不一樣。他不喜歡全身上下滿是水泡的感受，而金泰亨蹭到他的頸窩裏。很久很久他都沒能睡著，直到眼皮終於沉甸甸的闔上，他聽到有人喚他田柾國、田柾國，最後一個字的尾音拖長，像嗚嗚的哭聲，他又幻聽了。

      ⠀

      後來他們更多的投入了個人的行程，金泰亨不再常常出現在他家門口，田柾國也不會去找他，明白金泰亨比自己更忙的同時，又怕開門的不是金泰亨。偶爾待在一起的時候，他才發現原來他們兩個可以那麼安靜。田柾國聞者尷尬的空氣回想著他們過去獨處的時候都聊些什麼，才發現他們玩遊戲、運動、看電影，但不聊天。那是田柾國第一次覺得，他也不是那麼了解金泰亨。

      ⠀

      現在田柾國獨自躺在床上，藥效發作讓他逐漸不再像半夜那樣難受，身子卻還是沉甸甸的，迷迷糊糊的拿起手機卻沒有任何目標，突然跳出一條金泰亨傳送了一張照片，點開拿起來像路邊隨便拍了一隻小貓，正朝著金泰亨走過來的樣子。

      ⠀

      “好可愛”田柾國隨手回了句，對面秒讀回道“沒在休息？”“睡不著”“好點了？”“嗯，吃了藥好很多了。”

      ⠀

      對面安靜了下來，田柾國猛然回想起他倆搬家不久，他在家裡腳踝扭傷了動彈不得，第一個給金泰亨傳去簡訊。那人不到半個小時出現在自己家門口，熟門熟路的打開門看到了那個踉蹌扶著流理台才能勉強站立的自己。

      ⠀

      金泰亨笑得開懷，連忙前去扶起哭笑不得的田柾國，田柾國問他怎麼那麼快？金泰亨停頓片刻說剛剛和朋友在附近吃飯。

      ⠀

      朋友？田柾國很意外金泰亨說的是朋友，而不是一個確切的人名，他通常有把握記住金泰亨熟識的所有朋友，甚至能從中猜到他們去做了什麼，但金泰亨只說了是朋友。他被好奇心折騰的惱火，一言不發的扶著金泰亨被安置在床尾。

      ⠀

      金泰亨在他面前彎下腰，視線裡是金泰亨金棕色的髮旋。那人伏下身給自己脫襪子，田柾國難以自制的不耐浮上表面，幸虧金泰亨沒有抬頭看他。他抬起腳抵在金泰亨的胸口，力道不大卻足以讓金泰亨不得不退一步並抬首困惑地望著他一言不發，知道田柾國會搶先他說話。

      ⠀

      「去哪了？」他問，他也不知道為何自己問出口了。「跟誰？」他追問，金泰亨被問的一愣表情卻一動不動的維持住剛抬頭的表情，惹得田柾國心底不停透出後悔，他就不該問。

      ⠀

      「朋友。」金泰亨回道。金泰亨的回應把他心裡剛湧上的悔意壓過，「哪個朋友。」他又問。

      ⠀

      這次他迎來了更久的沉默，金泰亨抓住他的腳踝，緩緩的放下去，手掌抵著他的腳掌心，因為空調房的寒意有些發冷，那人的指節在他些許粗糙的腳底板上觸動讓人心癢，田柾國甚至有些顧不上臉上肌肉的抽搐。金泰亨一言不發的垂眸繼續給田柾國脫襪子，張口卻沒聲音。

      ⠀

      「新朋友。」他久違的吐出幾個字，「來不及介紹給你，有機會。」他說。

      ⠀

      田柾國心裡聞言心裡些許踏實，理智卻在金泰亨的沉默間回籠，實際上是他也無能再去想更多更多，等金泰亨把他的襪子徹底褪去，又輕輕地放下。

      ⠀

      他猛地闔上眼睛，想徹底切斷畫面。果然回憶這種東西特別折磨人，方方面面上的。但想到金泰亨的回覆又覺得不是那麼尷尬。他一把把手機丟出去，沒過良久又震動了幾聲，使他不得不再爬過去撿起來看訊息，發現是金泰亨問他明天晚餐要不要一起吃。

      ⠀

      “炸雞？炸醬麵？我買去”

      “啊，你生病，吃點清淡的”金泰亨又補上，田柾國本來想回他自己生病別來了。從前他這麼說，金泰亨嘴上答應，還是會在宵夜時間準時按門鈴，帶著嘻笑的表情領著宵夜出現，說：「我身體好，不怕。」被田柾國無奈的放進門。

      ⠀

      隔天晚上，金泰亨果然到了田柾國家門口，電鈴不停的響，田柾國從臥室跑著去給他開門，見到金泰亨一臉裝作委屈的樣子看得田柾國又無奈又好笑，金泰亨邊進門嘴邊邊碎念著：「你改密碼了。」田柾國不以為意：「嗯，定時換一下，你上次來都多久了。」

      ⠀

      不過金泰亨沒趕上飯點來，帶了點飲料來。田柾國伸手接過發現是一袋子的可樂和香蕉牛奶。田柾國看著那帶沉沉的購物袋裡頭發愣，直到金泰亨在他前面回頭喊他：「看什麼？你不愛喝香蕉牛奶了嗎？你小時候最愛的。」

      ⠀

      「沒有。」只是很久沒喝了，久到自己都忘記了。

      ⠀

      田柾國家特別外擴出去的陽台景色極佳，分居後金泰亨幾次來訪都賴在陽台上不走，甚至全員一起在田柾國家聚餐，田柾國也會在爛醉的一群男人們中想起陽台邊的金泰亨。田柾國後來在那安置了兩個躺椅和矮桌，不過金泰亨不來的話田柾國也鮮少去外頭。金泰亨打開門的時候還嘟囔了幾聲這門怎麼變難開了。

      ⠀

      「我還給你帶了一些感冒藥，上哪找那麼照顧你的哥。」田柾國嘆了口氣，想回他醫生開的藥夠、他也快好了。不過金泰亨也就這些時刻能在他面前擺哥哥的架子，平常要不是他更幼稚、就是他倆一起被訓，沒有比較的分。

      ⠀

      「謝謝哥。」他邊笑，領著一袋子的飲料坐在隔壁的躺椅上，金泰亨卻看著他顰眉：「生病還喝酒？」眼睛盯著田柾國右手拿的威士忌，田柾國語氣狡黠的回他就喝一點。

      ⠀

      金泰亨在一旁自顧自的點煙，手半掩住徐徐的晚風。田柾國邊給自己倒酒邊能看見金泰亨垂著眼睫給自己點煙，下意識想伸手接，卻想到自己感冒還是別這麼任性。

      ⠀

      「之後找個像哥一樣會照顧你的。」金泰亨一邊笑，睜大那雙眼睛，田柾國莫名的想這麼睜大眼睛會不會真能看透他的心思。田柾國翻了個大白眼，「呀，哥，好噁心。」笑著回他。

      ⠀

      金泰亨抖了抖煙灰，煙灰就隨著風散開，在他看不見的半空中左右左右的往下飄，田柾國呆呆的望著煙灰飄的不見蹤影，餘光是金泰亨吐出的白煙。「找不到吧？」他又補充。

      ⠀

      要是是別人問起，他會說這個世界怎麼能存在兩個金泰亨呢？那全世界都會閃瞎的。而他此刻的目光追隨著四散的白煙，像煙嵐像白雲，像能蒙蔽雙眼卻若隱若現的白紗，在他倆之間揮發，他得以看清金泰亨。

      ⠀

      金泰亨，對他而言是名字更像一個分類，給那些太多的第一次做分類。第一次逃課去玩、第一次逃練習、第一次跟別人一起洗澡、第一次和人抱著睡覺。而還有第一次，他對一個人的靠近產生他因為陌生而形容不來的一種恐懼，希望他靠近、又希望他停下的恐懼，那人近在咫尺時混亂的心跳和發熱的耳朵，游移的目光貪戀美色的同時又心虛的躲開。第一次他不知道該把一個人放在哪裡。

      ⠀

      有人會像金泰亨嗎？金泰亨是灰色的，屬於他心裡一個叫做金泰亨的灰色地帶，可灰色比起黑白色又更難定義，黑一點、白一點都是灰色，但都不是那個灰色。

      ⠀

      「找不到吧。」田柾國復誦，對上金泰亨的笑眼，深邃的眉宇被擋在白煙後真的像被煙嵐籠罩的山巒，給他一種靜謐又屹立不搖的感覺。而田柾國的複述和回眸鬆動了他的眉眼，蘋果肌先落下，再來才是他高高揚起的嘴角。

      ⠀

      過去太遠了，未來也太遠，但今天是他們想過的未來，田柾國想問金泰亨覺得他們如何，他還記得當初嗎？還記得當初以為的未來嗎？

      ⠀

      那田柾國呢？有第二個田柾國嗎？

      ⠀

      金泰亨還給他倒酒，其實他的酒杯還有半滿，他假裝不知道金泰亨的窘迫，突然想喝香蕉牛奶。他不能喝酒的年紀金泰亨早他兩年能喝，青春期成為大人的興奮讓金泰亨給他倆買飲料的時候都會給自己買一瓶水果酒。直到後來發現金泰亨連葡萄酒都得挑單寧味淡的，才了解其實他根本不愛喝酒。成年的新鮮感過了，他才真正知道自己想要的是什麼。

      ⠀

      倒是那時候金泰亨不用問就知道給田柾國買香蕉牛奶，甚至到了成年依舊如此。後來田柾國家裡最不缺的就是威士忌，金泰亨仍然照舊給田柾國帶香蕉牛奶，卻偶爾的會被放在冰箱很久很久。香蕉牛奶、金泰亨，當田柾國將兩者連結，就會想到對他們來說已經是“年輕時”的過去。

      ⠀

      對，香蕉牛奶，他剛剛分明是在想喝香蕉牛奶的，現在居然想看金泰亨的眼睛。他看著，想到金泰亨又想到他們的青春──金泰亨也代表他的青春。

      ⠀

      田柾國赫然想起，他到現在都還沒問金泰亨今天跟誰出去了。可能是哪個女人、男人，他沒見過的，會像他一樣跟金泰亨打打鬧鬧最後抱在一起，這些都是他不曾參與的金泰亨。

      ⠀

      金泰亨偶爾傳來幾張生活照不刻意更不做作，給他拍日出也像隨手的事情，可他不會知道金泰亨按下傳送後手機熄暗後他去了哪。他曾經太好奇，好奇的惱火和不耐，現如今卻變成可有可無的一條新聞，他不知道他若回到過去還會不會如此好奇。

      ⠀

      田柾國的青春過了、金泰亨和田柾國的青春都過了，青春為名的一切褪去美麗的外殼就是幼稚，人們愛提起青春卻不愛提起年少的懵懂無知。名不配位的想法也是幼稚。

      ⠀

      金泰亨看著田柾國有些腫的臉，覺得田柾國這些日子裡話越來越少了，也許只是對他。覺得隔著這個矮桌看過去的田柾國離自己好遠。田柾國正在袋子裡翻找香蕉牛奶，撕開包裝握著卻不喝，金泰亨盯著這一幕呆愣。

      ⠀

      「田柾國。」

      「嗯？」金泰亨喚他卻沒應聲，他只是想確定眼前的人是不是還叫這個名字。那人側臉鋒利的下頜線、仍然圓潤的眼睛、笑起來的兔牙，跟小時候的田柾國一模一樣，跟金泰亨總下意識愛護的田柾國一樣。

      ⠀

      但剛剛田柾國看著自己的時候，他卻覺得陌生。金泰亨不知道的是那天在電視機面前，他也是這麼看著田柾國的。金泰亨此刻也將那個眼神定義為深情，深情的金泰亨不敢再繼續看下去。只是那時的金泰亨想要的是答案，田柾國的眼神更像結局，他設想從結局往回推卻徒勞無功。

      ⠀

      「哥，你還記得之前我們在看電影的時候我問你怎麼了嗎？」田柾國目光透過半透明的玻璃圍欄看出去，金泰亨正要到口的菸頓在半空中，明顯的一愣被田柾國盡收眼底還得佯裝不經意，「我那時候覺得你有話要說，只是不知道為什麼你後來沒說，我想了很久。」

      ⠀

      「是嗎。」金泰亨喃喃。「嗯，現在呢？可以跟我說了嗎？」

      ⠀

      金泰亨突然很想笑，他把臉埋進手中，掌心下的嘴難以抑制的揚起，又向上把瀏海的頭髮往後撥開。赫然發現自己也不是那麼懂田柾國。

      ⠀

      「我忘了，太久了。」金泰亨笑道，把煙掐在煙灰缸裡抬眼看向田柾國微笑的側臉。那人聞言點點頭，他又補充：「都過去的事情了。」而後掌心捂住嘴，此刻的他表情些許僵硬，嘴角止不住的抽動卻難以連接到心裡那塊屬於身邊人的記憶，他渾然發覺那困擾他的心緒像惱人又美麗的霧靄蒙上他的雙眼，他曾經於此迷失，直到他發現那不重要了。

      ⠀

      金泰亨吸了吸鼻子，看著遠方塔台的燈忽明忽暗。田柾國帶著感冒的鼻音的嗓音不停迴響，他咬下唇讓胸口悶著的氣從齒縫釋出，眨了眨乾澀的眼睛又把掐了一半的煙拿起來抽了一口：「說沒說都一樣。」

      ⠀

      「喔。」田柾國不以為然。「我也覺得，都一樣。」

      ⠀

      金泰亨忽然慶幸那天以兩人看電影看到睡著為結，那天是他那陣子睡過最安穩的一夜，當時的他正值迷茫的低谷，越近深夜理智越發被壓力蓋過，讓他總想衝動的做些什麼讓他混亂的思緒不再侵占他的腦海。於是當晚，田柾國撇過頭的那個瞬間深深的烙在他的腦海裡讓他睡了沉沉的一覺。後來他為此失眠，走到客廳預想中會遇見同樣失眠的田柾國卻枉然，不自覺的鬆了口氣。原來一切都已經是最好的安排。

      ⠀

      「倒是你，」金泰亨倏地坐起身來玩笑似的看向田柾國，「我昨天問你怎麼沒回我？」

      ⠀

      「什麼？」「我不是問你還好嗎？」田柾國乾笑幾聲，連忙撇開眼去看那個塔台，「有嗎？我沒看到。」金泰亨哼了一聲沒在追問。

      ⠀

      田柾國遲遲的發現，原來金泰亨不是灰色的，金泰亨是在他心裡一個截然不同的顏色，他沒有見過，只是他從來沒敢給那個顏色名分。因為是灰色所以被放在隊友、朋友裡都不突兀，且幾分神似，但都不契合。田柾國很早就知道金泰亨不屬於那裡，但他又心知肚明只能屬於那裡。

      ⠀

      「我們那天看的是什麼電影？」

      ⠀

      「忘了。」金泰亨回道，盯著煙灰缸裡的那點小紅點徹底褪去，他真的忘了，沒有人在看那個電影。田柾國聞言若有所思的深吸一口氣，又變為笑吐出來，嗯了聲。

      ⠀

      忘記也沒關係，他們沒有人好奇那部電影的結局，重來一次他們也不會看。重來一次也許田柾國會更投入的望著金泰亨的眼睛，甚至記得他呼吸的頻率，他們還是會相擁著進入不同的夢境。他們至少有過那一天，就算結局永遠是今天。

      ⠀

      田柾國後來打開那張日出的照片，空無一人。他看了很久很久，久到特別被他設置長開的螢幕也黑了下去，印出自己垂下的眼睫和因為無神微微敞開的嘴。只記住了左下角有金泰亨不小心拍進去的手指。
